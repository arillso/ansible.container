---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

on:
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    security-events: write
    actions: read
    pull-requests: read

jobs:
    codeql:
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-06-18
        with:
            language: python

    security-secrets:
        uses: arillso/.github/.github/workflows/security-secrets.yml@2026-06-18
