---
name: Nightly Security Scan
run-name: |
    Security Scan by @${{ github.actor }}

on:
    schedule:
        - cron: "0 2 * * *" # Daily 02:00 UTC (public repo — Actions minutes are free)
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: false

permissions:
    # security-sbom.yml declares `contents: write`; a called workflow never
    # gets more than its caller grants, so the SBOM upload needs it here.
    contents: write
    security-events: write
    actions: read
    pull-requests: read

jobs:
    codeql:
        uses: arillso/.github/.github/workflows/security-codeql.yml@2026-08-19
        with:
            language: python

    security-secrets:
        uses: arillso/.github/.github/workflows/security-secrets.yml@2026-08-19

    security-config:
        uses: arillso/.github/.github/workflows/security-config.yml@2026-08-19
        with:
            scan-ansible: true
            ansible-path: roles

    security-sbom:
        uses: arillso/.github/.github/workflows/security-sbom.yml@2026-08-19
        with:
            artifact-type: filesystem
            artifact-ref: "."
