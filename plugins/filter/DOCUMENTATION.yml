---
# Fleet Filter Plugins Documentation

plugin_type: filter

filters:
    fleet_transform_targets:
        description:
            - Transform Fleet targets from Ansible's snake_case convention to Fleet API's camelCase format
            - Recursively transforms all nested dictionary keys
            - Handles complex structures including cluster_selector, match_labels, match_expressions
            - Preserves all values and structure while only changing key names
        version_added: "0.0.4"
        options:
            _input:
                description:
                    - List of target dictionaries with snake_case keys
                    - Typically contains cluster_selector, cluster_name, cluster_group, etc.
                type: list
                elements: dict
                required: true
        examples:
            - name: Transform Fleet targets in a GitRepo configuration
              description: Convert snake_case target configuration to camelCase for Fleet API
              code: |
                  - name: Apply GitRepo with transformed targets
                    kubernetes.core.k8s:
                      definition:
                        apiVersion: fleet.cattle.io/v1alpha1
                        kind: GitRepo
                        spec:
                          targets: "{{ my_targets | arillso.container.fleet_transform_targets }}"
                    vars:
                      my_targets:
                        - cluster_selector:
                            match_labels:
                              environment: production
                              region: us-west

            - name: Multiple targets with different selectors
              description: Transform multiple target configurations
              code: |
                  - name: Configure multi-cluster deployment
                    set_fact:
                      transformed_targets: "{{ fleet_targets | arillso.container.fleet_transform_targets }}"
                    vars:
                      fleet_targets:
                        - cluster_selector:
                            match_labels:
                              tier: frontend
                        - cluster_name: production-cluster
                        - cluster_group: staging-group

        return:
            _value:
                description: List of target dictionaries with camelCase keys suitable for Fleet API
                type: list
                elements: dict

    to_camel_case:
        description:
            - Convert a snake_case string to camelCase format
            - Useful for transforming Ansible variable names to API-compatible formats
            - Preserves the first word in lowercase and capitalizes the first letter of subsequent words
        version_added: "0.0.4"
        options:
            _input:
                description:
                    - String in snake_case format to be converted
                type: string
                required: true
        examples:
            - name: Convert a single string
              description: Transform a snake_case string to camelCase
              code: |
                  - name: Transform variable name
                    debug:
                      msg: "{{ 'cluster_selector' | arillso.container.to_camel_case }}"
                    # Returns: clusterSelector

            - name: Use in variable transformation
              description: Create API-compatible field names
              code: |
                  - name: Create API payload
                    set_fact:
                      api_field: "{{ field_name | arillso.container.to_camel_case }}"
                    vars:
                      field_name: "match_labels"
                    # Results in: matchLabels

        return:
            _value:
                description: String converted to camelCase format
                type: string

    apt_version_pin:
        description:
            - Pick the full apt version string for a marketing version out of apt-cache madison output
            - apt matches an "=" pin against the full version string, which carries
              an optional epoch and a distro release suffix, and does not expand
              globs in that pin
            - A bare pin such as docker-ce=29.7.2 therefore never resolves, and neither does docker-ce=*29.7.2-*; only the string madison prints does
            - Returns none when the version is not in the repository, so the calling task can fail with a readable message instead of a Python traceback
        version_added: "2.0.0"
        options:
            _input:
                description:
                    - Lines of apt-cache madison <package> output, typically stdout_lines of the command
                    - Each line looks like "<package> | <version> | <repository>"; only the middle field is read
                type: list
                elements: string
                required: true
            version:
                description:
                    - The marketing version to resolve, for example 29.7.2 or 5.4.0
                    - Matched on "(^|:)<version>-" so the version either opens the
                      string or follows the epoch colon, and the trailing hyphen
                      keeps 29.7.1 from taking 29.7.10 and rejects a bare prefix
                      like 29.7
                    - Dots are matched literally, so 5.4.0 does not also match a 5X4X0 build
                type: string
                required: true
        examples:
            - name: Resolve an apt pin at runtime
              description: Look up the exact version string before pinning it
              code: |
                  - name: Resolve the apt version string for the pin
                    ansible.builtin.command:
                      cmd: apt-cache madison docker-compose-plugin
                    register: compose_madison
                    changed_when: false

                  - name: Set the resolved apt version string
                    ansible.builtin.set_fact:
                      docker_compose_v2_apt_version: >-
                        {{ compose_madison.stdout_lines
                           | arillso.container.apt_version_pin(docker_compose_v2_version) }}
                    # Returns: 5.4.0-1~ubuntu.24.04~noble

        return:
            _value:
                description: Full apt version string including epoch and distro suffix, or none when no line matches
                type: string

notes:
    - The Fleet filters are specifically designed for Rancher Fleet GitOps target configurations
    - Common transformations include cluster_selector -> clusterSelector, match_labels -> matchLabels
    - The Fleet filters preserve all values unchanged, only transforming dictionary keys
    - apt_version_pin never raises on a missing version; the readable error belongs in an ansible.builtin.fail task
    - Nested structures are handled recursively

seealso:
    - module: kubernetes.core.k8s
      description: Kubernetes resource management
    - ref: Fleet GitOps Documentation
      description: Official Rancher Fleet documentation
      link: https://fleet.rancher.io/

author:
    - Arillso (@arillso)
