---
# Full converge against an ephemeral k3s cluster.
#
# The helm role drives a live Kubernetes API (HelmChart CRDs via
# kubernetes.core / the k3s Helm controller). `prepare.yml` stands that
# cluster up inside this VM, so the role is exercised end to end without
# an external cluster and without credentials: the CR is applied, the
# k3s Helm controller picks it up, and verify asserts the resulting
# install Job and Pod.
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: molecule-qemu

platforms:
    - name: helm-ubuntu-22.04
      image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
      image_checksum: sha256:https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2222
      network_ssh_user: ubuntu
      vm_cpus: 2
      vm_memory: 3072

provisioner:
    name: ansible
    config_options:
        defaults:
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            helm-ubuntu-22.04:
                ansible_become: true
    playbooks:
        prepare: prepare.yml
        converge: converge.yml
        verify: verify.yml

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - verify
        - cleanup
        - destroy
