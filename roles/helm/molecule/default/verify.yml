---
# Asserts the full chain the role is responsible for: the HelmChart CR it
# applied, the install Job the k3s Helm controller derived from it, and
# the workload that Job released. Anything short of the Pod would pass
# even if the controller never acted on the CR.
#
# Asserted on every host, mirroring the role: each VM runs its own k3s
# cluster, so the role applies the CR to all of them and every cluster
# must carry the full chain. Scoping this to a single host would let a
# role that silently skipped a cluster still pass.
- name: Verify
  hosts: all
  become: true
  vars:
      helm_verify_kubeconfig: /etc/rancher/k3s/k3s.yaml
  tasks:
      - name: Fetch the HelmChart resource
        kubernetes.core.k8s_info:
            api_version: helm.cattle.io/v1
            kind: HelmChart
            name: podinfo
            # charts.yml pins the CR to kube-system regardless of the
            # chart's target namespace.
            namespace: kube-system
            kubeconfig: "{{ helm_verify_kubeconfig }}"
        register: helm_verify_chart

      - name: Assert the HelmChart carries the role's spec and labels
        ansible.builtin.assert:
            that:
                - helm_verify_chart.resources | length == 1
                - helm_verify_chart.resources[0].spec.chart == "podinfo"
                - helm_verify_chart.resources[0].spec.version == "6.14.1"
                - helm_verify_chart.resources[0].spec.targetNamespace == "podinfo"
                - >-
                    helm_verify_chart.resources[0].metadata.labels['app.kubernetes.io/managed-by']
                    == "ansible-helm-role"
            fail_msg: "HelmChart 'podinfo' is missing or does not match the converge spec"
            success_msg: "HelmChart 'podinfo' applied with the expected spec"

      - name: Fetch the Helm install Job
        kubernetes.core.k8s_info:
            api_version: batch/v1
            kind: Job
            name: helm-install-podinfo
            namespace: kube-system
            kubeconfig: "{{ helm_verify_kubeconfig }}"
        register: helm_verify_job

      - name: Assert the install Job succeeded
        ansible.builtin.assert:
            that:
                - helm_verify_job.resources | length == 1
                - helm_verify_job.resources[0].status.succeeded | default(0) | int >= 1
            fail_msg: "Helm install Job 'helm-install-podinfo' did not complete successfully"
            success_msg: "Helm install Job 'helm-install-podinfo' completed"

      - name: Fetch the released pods
        kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: podinfo
            label_selectors:
                - app.kubernetes.io/name=podinfo
            kubeconfig: "{{ helm_verify_kubeconfig }}"
        register: helm_verify_pods
        # The Job reports success once helm finished; the pod may need a
        # moment more to pass its readiness probe.
        until: >-
            helm_verify_pods.resources
            | selectattr('status.phase', 'equalto', 'Running')
            | list | length >= 1
        retries: 30
        delay: 10

      - name: Assert the chart released a running pod
        ansible.builtin.assert:
            that:
                - >-
                    helm_verify_pods.resources
                    | selectattr('status.phase', 'equalto', 'Running')
                    | list | length >= 1
            fail_msg: "No running podinfo pod in namespace 'podinfo'"
            success_msg: "Chart released a running pod in namespace 'podinfo'"

      # The role installs the Kubernetes Python client from the
      # distribution on Debian/Ubuntu and from PyPI on EL. Both branches
      # must land the same two importable modules, and oauthlib must be
      # new enough to carry SIGNATURE_RSA — the distribution package is
      # not version-pinned the way the PyPI requirement is, so assert it
      # here rather than assume it.
      - name: Read the installed oauthlib version
        ansible.builtin.command:
            cmd: "{{ ansible_python_interpreter | default('/usr/bin/python3') }} -c 'import oauthlib; print(oauthlib.__version__)'"
        register: helm_verify_oauthlib
        changed_when: false

      - name: Assert oauthlib satisfies the SIGNATURE_RSA requirement
        ansible.builtin.assert:
            that:
                - helm_verify_oauthlib.stdout | trim is version('3.2.0', '>=')
            fail_msg: >-
                oauthlib {{ helm_verify_oauthlib.stdout | trim }} is older than 3.2.0,
                so requests-oauthlib cannot import SIGNATURE_RSA
            success_msg: "oauthlib {{ helm_verify_oauthlib.stdout | trim }} satisfies >= 3.2.0"

      - name: Read the installed kubernetes client version
        ansible.builtin.command:
            cmd: "{{ ansible_python_interpreter | default('/usr/bin/python3') }} -c 'import kubernetes; print(kubernetes.__version__)'"
        register: helm_verify_kubernetes
        changed_when: false

      - name: Assert the kubernetes client imports
        ansible.builtin.assert:
            that:
                - helm_verify_kubernetes.stdout | trim | length > 0
            fail_msg: "The kubernetes Python client is not importable"
            success_msg: "Kubernetes Python client {{ helm_verify_kubernetes.stdout | trim }} is importable"
