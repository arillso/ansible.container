---
# A dynamic include is evaluated by its own tags only; `apply` hands the
# same tags down to the included tasks, otherwise `--tags helm` would run
# the include and then skip every task inside it.
- name: "Install the Kubernetes Python client"
  ansible.builtin.include_tasks:
      file: dependencies.yml
      apply:
          tags:
              - helm
              - helm-dependencies
              - system-packages
  when: helm_enable_charts | bool
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: "Helm Chart Management"
  tags:
      - helm
      - helm-charts
      - kubernetes
  block:
      - name: "Debug: Display Helm configuration"
        ansible.builtin.debug:
            var: item
        loop:
            - "helm_enable_charts: {{ helm_enable_charts }}"
            - "helm_charts count: {{ helm_charts | length }}"
            - "helm_repositories count: {{ helm_repositories | length }}"
        when: helm_debug_enabled | default(false)

      - name: "Validate Helm prerequisites"
        ansible.builtin.include_tasks:
            file: prerequisites.yml
            apply:
                tags:
                    - helm
                    - helm-charts
                    - kubernetes
        when: helm_enable_charts | default(false)

      - name: "Deploy Helm Charts"
        ansible.builtin.include_tasks:
            file: charts.yml
            apply:
                tags:
                    - helm
                    - helm-charts
                    - kubernetes
        when:
            - helm_enable_charts | default(false)
            - helm_charts | length > 0

  rescue:
      - name: "Handle Helm deployment failure"
        ansible.builtin.fail:
            msg: |
                Helm deployment failed. Check the following:
                - Kubernetes cluster is accessible
                - Cattle Operator is running
                - Chart configurations are valid
                Error: {{ ansible_failed_result.msg | default('Unknown error') }}
