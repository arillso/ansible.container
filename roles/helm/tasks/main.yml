---
# Install required Python dependencies for Kubernetes operations.
# The packages role's `packages` entry point runs unhold/remove/install/hold
# only — it never includes cache.yml, and install.yml pins
# `update_cache: false`. On a host whose apt cache is empty (a fresh VM, as in
# the molecule scenarios) the package is then unfindable, so refresh the cache
# here first.
- name: Update the package cache for the Kubernetes Python client
  ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  become: true
  when: ansible_facts['pkg_mgr'] in ['apt', 'apt-get']
  changed_when: false
  tags:
      - helm
      - helm-dependencies
      - system-packages

# PEP 668 decides where the client comes from, not the package manager.
# An interpreter that ships an EXTERNALLY-MANAGED marker refuses a
# system-wide `pip install` with "error: externally-managed-environment",
# so there the distribution packages are the only way in. Everywhere else
# PyPI stays, because it is the only source that honours the version
# floors below on every platform this role advertises.
#
# Keying on the marker rather than on the distribution matters for the
# older apt platforms: bullseye, bookworm and jammy predate PEP 668 and
# ship python3-kubernetes/python3-oauthlib too old for
# `kubernetes.core >= 2.4.0` (needs kubernetes >= 12.0.0) and for
# SIGNATURE_RSA (needs oauthlib >= 3.2.0). They keep the PyPI path and
# its floors; only a marked interpreter takes the distribution packages,
# which on those releases (noble and newer) are new enough.
# Ask the target interpreter for its own stdlib path instead of guessing
# it from the version: the marker sits next to the stdlib, and only the
# interpreter that would run the install knows where that is.
- name: Check whether the system interpreter is externally managed
  ansible.builtin.command:
      cmd: >-
          {{ ansible_facts['python']['executable'] }} -c
          "import os,sysconfig;print(os.path.exists(os.path.join(sysconfig.get_path('stdlib'),'EXTERNALLY-MANAGED')))"
  register: _helm_externally_managed
  changed_when: false
  check_mode: false
  tags:
      - helm
      - helm-dependencies
      - system-packages

# arillso.system.packages is no help here: it drives ansible.builtin.apt
# throughout and advertises Debian and Ubuntu only, so it cannot serve
# the EL 9 platform this role declares.
- name: Install the Kubernetes Python client from the distribution
  ansible.builtin.apt:
      name:
          - python3-kubernetes
          - python3-oauthlib
      state: present
  become: true
  when: _helm_externally_managed.stdout | trim == 'True'
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: Install pip for the Kubernetes Python client
  ansible.builtin.package:
      name: python3-pip
      state: present
  become: true
  when: _helm_externally_managed.stdout | trim != 'True'
  tags:
      - helm
      - helm-dependencies
      - system-packages

# oauthlib is listed explicitly because pip leaves a distribution-provided
# copy in place: EL 9 ships oauthlib 3.1.1 as an RPM, while the kubernetes
# client pulls requests-oauthlib, which needs SIGNATURE_RSA from a newer
# oauthlib. Without the upgrade the install succeeds and the very next
# module import dies with "cannot import name 'SIGNATURE_RSA'".
- name: Install the Kubernetes Python client from PyPI
  ansible.builtin.pip:
      name:
          - kubernetes
          - oauthlib>=3.2.0
      state: present
  become: true
  when: _helm_externally_managed.stdout | trim != 'True'
  register: _helm_python_client_install
  retries: 3
  delay: 10
  until: _helm_python_client_install is succeeded
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: "Helm Chart Management"
  tags:
      - helm
      - helm-charts
      - kubernetes
  block:
      - name: "Debug: Display Helm configuration"
        ansible.builtin.debug:
            var: item
        loop:
            - "helm_enable_charts: {{ helm_enable_charts }}"
            - "helm_charts count: {{ helm_charts | length }}"
            - "helm_repositories count: {{ helm_repositories | length }}"
        when: helm_debug_enabled | default(false)

      - name: "Validate Helm prerequisites"
        ansible.builtin.include_tasks: prerequisites.yml
        when: helm_enable_charts | default(false)

      - name: "Configure Helm repositories"
        ansible.builtin.include_tasks: repositories.yml
        when:
            - helm_enable_charts | default(false)
            - helm_repositories | length > 0

      - name: "Deploy Helm Charts"
        ansible.builtin.include_tasks: charts.yml
        when:
            - helm_enable_charts | default(false)
            - helm_charts | length > 0

  rescue:
      - name: "Handle Helm deployment failure"
        ansible.builtin.fail:
            msg: |
                Helm deployment failed. Check the following:
                - Kubernetes cluster is accessible
                - Cattle Operator is running
                - Helm repositories are reachable
                - Chart configurations are valid
                Error: {{ ansible_failed_result.msg | default('Unknown error') }}
