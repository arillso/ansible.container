---
# Role-level validation, so a bad chart definition fails before any package is
# installed or the cluster is contacted, and outside the rescue below, which
# would replace the per-chart message with "One or more items failed".
# An unknown repository key falls back to no repo at all and the controller
# fails asynchronously in the cluster; a timeout without unit is rejected by
# the HelmChart API (metav1.Duration).
- name: "Validate Helm chart definitions"
  ansible.builtin.assert:
      that:
          - item.name is defined
          - item.chart is defined
          - >-
              item.repository is not defined or item.repository in helm_repositories
              or item.repo is defined
          - >-
              item.timeout | default(helm_chart_defaults.timeout) | string
              is match('^(0|(' ~ helm_duration_part_pattern ~ ')+)$')
      fail_msg: >-
          Chart '{{ item.name | default('<unnamed>') }}': needs name and chart,
          repository must be a key of helm_repositories
          ({{ helm_repositories.keys() | list | join(', ') }}) unless repo is
          set, and timeout a duration such as 5m, 1h30m or 90s.
      quiet: true
  loop: "{{ helm_charts }}"
  loop_control:
      label: "{{ item.name | default('<unnamed>') }}"
  when: helm_enable_charts | bool
  tags:
      - helm
      - helm-charts
      - kubernetes

# Every task in dependencies.yml carries these tags itself, so the include
# needs them only to be reached under --tags.
- name: "Install the Kubernetes Python client"
  ansible.builtin.include_tasks: dependencies.yml
  when: helm_enable_charts | bool
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: "Helm Chart Management"
  tags:
      - helm
      - helm-charts
      - kubernetes
  block:
      - name: "Debug: Display Helm configuration"
        ansible.builtin.debug:
            var: item
        loop:
            - "helm_enable_charts: {{ helm_enable_charts }}"
            - "helm_charts count: {{ helm_charts | length }}"
            - "helm_repositories count: {{ helm_repositories | length }}"
        when: helm_debug_enabled | default(false)

      # A dynamic include is evaluated by its own tags only, and the tasks in
      # prerequisites.yml and charts.yml carry none; `apply` hands the tags
      # down, otherwise `--tags helm` would run the include and then skip
      # every task inside it.
      - name: "Validate Helm prerequisites"
        ansible.builtin.include_tasks:
            file: prerequisites.yml
            apply:
                tags:
                    - helm
                    - helm-charts
                    - kubernetes
        when: helm_enable_charts | default(false)

      - name: "Deploy Helm Charts"
        ansible.builtin.include_tasks:
            file: charts.yml
            apply:
                tags:
                    - helm
                    - helm-charts
                    - kubernetes
        when:
            - helm_enable_charts | default(false)
            - helm_charts | length > 0

  rescue:
      - name: "Handle Helm deployment failure"
        ansible.builtin.fail:
            msg: |
                Helm deployment failed. Check the following:
                - Kubernetes cluster is accessible
                - Cattle Operator is running
                - Chart configurations are valid
                {% set failed = ansible_failed_result.results | default([])
                   | selectattr('failed', 'defined') | selectattr('failed') | list %}
                {% for r in failed %}
                - {{ r.item.name | default(r.item) }}: {{ r.msg | default('failed after ' ~ r.attempts | default(1) ~ ' attempts') }}
                {% else %}
                Error: {{ ansible_failed_result.msg | default('Unknown error') }}
                {% endfor %}
