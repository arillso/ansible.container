---
# Install required Python dependencies for Kubernetes operations.
# The packages role's `packages` entry point runs unhold/remove/install/hold
# only — it never includes cache.yml, and install.yml pins
# `update_cache: false`. On a host whose apt cache is empty (a fresh VM, as in
# the molecule scenarios) the package is then unfindable, so refresh the cache
# here first.
- name: Update the package cache for the Kubernetes Python client
  ansible.builtin.apt:
      update_cache: true
      cache_valid_time: 3600
  become: true
  when: ansible_facts['pkg_mgr'] in ['apt', 'apt-get']
  changed_when: false
  tags:
      - helm
      - helm-dependencies
      - system-packages

# The client is installed per package manager, because neither source
# serves both platforms this role declares:
#
# * Debian/Ubuntu take the distribution packages. Since Python 3.11 the
#   system interpreter is marked externally managed (PEP 668) and a
#   system-wide `pip install` aborts with
#   "error: externally-managed-environment".
# * EL 9 takes PyPI, because python3-kubernetes is a Debian name and the
#   EL 9 equivalent lives in EPEL, which is not enabled by default.
#
# arillso.system.packages is no help here either: it drives
# ansible.builtin.apt throughout and advertises Debian and Ubuntu only.
- name: Install the Kubernetes Python client from the distribution
  ansible.builtin.apt:
      name:
          - python3-kubernetes
          - python3-oauthlib
      state: present
  become: true
  when: ansible_facts['pkg_mgr'] in ['apt', 'apt-get']
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: Install pip for the Kubernetes Python client
  ansible.builtin.package:
      name: python3-pip
      state: present
  become: true
  when: ansible_facts['pkg_mgr'] not in ['apt', 'apt-get']
  tags:
      - helm
      - helm-dependencies
      - system-packages

# oauthlib is listed explicitly because pip leaves a distribution-provided
# copy in place: EL 9 ships oauthlib 3.1.1 as an RPM, while the kubernetes
# client pulls requests-oauthlib, which needs SIGNATURE_RSA from a newer
# oauthlib. Without the upgrade the install succeeds and the very next
# module import dies with "cannot import name 'SIGNATURE_RSA'".
- name: Install the Kubernetes Python client from PyPI
  ansible.builtin.pip:
      name:
          - kubernetes
          - oauthlib>=3.2.0
      state: present
  become: true
  when: ansible_facts['pkg_mgr'] not in ['apt', 'apt-get']
  register: _helm_python_client_install
  retries: 3
  delay: 10
  until: _helm_python_client_install is succeeded
  tags:
      - helm
      - helm-dependencies
      - system-packages

- name: "Helm Chart Management"
  tags:
      - helm
      - helm-charts
      - kubernetes
  block:
      - name: "Debug: Display Helm configuration"
        ansible.builtin.debug:
            var: item
        loop:
            - "helm_enable_charts: {{ helm_enable_charts }}"
            - "helm_charts count: {{ helm_charts | length }}"
            - "helm_repositories count: {{ helm_repositories | length }}"
        when: helm_debug_enabled | default(false)

      - name: "Validate Helm prerequisites"
        ansible.builtin.include_tasks: prerequisites.yml
        when: helm_enable_charts | default(false)

      - name: "Configure Helm repositories"
        ansible.builtin.include_tasks: repositories.yml
        when:
            - helm_enable_charts | default(false)
            - helm_repositories | length > 0

      - name: "Deploy Helm Charts"
        ansible.builtin.include_tasks: charts.yml
        when:
            - helm_enable_charts | default(false)
            - helm_charts | length > 0

  rescue:
      - name: "Handle Helm deployment failure"
        ansible.builtin.fail:
            msg: |
                Helm deployment failed. Check the following:
                - Kubernetes cluster is accessible
                - Cattle Operator is running
                - Helm repositories are reachable
                - Chart configurations are valid
                Error: {{ ansible_failed_result.msg | default('Unknown error') }}
