---
# Helm Chart Deployment Tasks via helm.cattle.io/v1 CRDs
# Enterprise-grade GitOps Helm deployment using Rancher's Helm Controller

- name: "Validate Helm Controller CRD availability"
  kubernetes.core.k8s_info:
      api_version: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: helmcharts.helm.cattle.io
      kubeconfig: "{{ helm_kubeconfig_path }}"
  register: _helm_crd_check

- name: "Fail if Helm Controller CRD is not available"
  ansible.builtin.fail:
      msg: "Helm Controller CRD 'helmcharts.helm.cattle.io' is not available. Ensure K3s Helm Controller is running."
  when:
      - _helm_crd_check.resources | length == 0

- name: "Create namespaces for Helm charts"
  kubernetes.core.k8s:
      name: "{{ item.namespace | default(helm_chart_defaults.namespace) }}"
      api_version: v1
      kind: Namespace
      state: present
      kubeconfig: "{{ helm_kubeconfig_path }}"
  loop: "{{ helm_charts }}"
  when:
      - item.create_namespace | default(helm_chart_defaults.create_namespace) | bool
      - item.namespace is defined or helm_chart_defaults.namespace != 'default'

# Snapshot before the deploy, so the wait below can tell whether this run
# changed a chart and therefore has to see a new install Job.
- name: "Read current HelmCharts"
  kubernetes.core.k8s_info:
      api_version: helm.cattle.io/v1
      kind: HelmChart
      name: "{{ item.name }}"
      namespace: kube-system
      kubeconfig: "{{ helm_kubeconfig_path }}"
  loop: "{{ helm_charts }}"
  loop_control:
      label: "{{ item.name }}"
  when: helm_deployment_wait | bool
  register: _helm_charts_before

- name: "Read current Helm install Jobs"
  kubernetes.core.k8s_info:
      api_version: batch/v1
      kind: Job
      name: "helm-install-{{ item.name }}"
      namespace: kube-system
      kubeconfig: "{{ helm_kubeconfig_path }}"
  loop: "{{ helm_charts }}"
  loop_control:
      label: "{{ item.name }}"
  when: helm_deployment_wait | bool
  register: _helm_jobs_before

# Deploy all Helm charts
- name: "Deploy Helm charts"
  kubernetes.core.k8s:
      state: present
      kubeconfig: "{{ helm_kubeconfig_path }}"
      definition:
          apiVersion: helm.cattle.io/v1
          kind: HelmChart
          metadata:
              name: "{{ item.name }}"
              namespace: kube-system
              labels:
                  app.kubernetes.io/managed-by: "ansible-helm-role"
                  app.kubernetes.io/component: "helm-chart"
                  helm.cattle.io/bootstrap: "{{ item.bootstrap | default(false) | string }}"
          spec:
              chart: "{{ item.chart }}"
              bootstrap: "{{ item.bootstrap | default(false) | bool }}"
              repo: "{{ helm_repositories[item.repository] | default(item.repo) | default(omit) }}"
              version: "{{ item.version | default(omit) }}"
              targetNamespace: "{{ item.namespace | default(helm_chart_defaults.namespace) }}"
              createNamespace: "{{ item.create_namespace | default(helm_chart_defaults.create_namespace) }}"
              timeout: "{{ item.timeout | default(helm_chart_defaults.timeout) }}"
              valuesContent: "{{ item['values'] | to_nice_yaml if (item.get('values') and item['values'] | length > 0) else omit }}"
              set: "{{ item.set | default(omit) }}"
  loop: "{{ helm_charts }}"
  when:
      - helm_charts | length > 0
  register: _helm_charts_deployment_result
  # The k3s Helm controller owns the HelmChart it reconciles and writes back
  # to the spec, so the resource never matches what the role applied and this
  # task reports changed on every run. Excluded from the molecule idempotence
  # check rather than papered over with changed_when: false, which would also
  # hide a genuine change.
  tags:
      - molecule-idempotence-notest

- name: "Wait for Helm charts to be ready"
  kubernetes.core.k8s_info:
      api_version: batch/v1
      kind: Job
      name: "helm-install-{{ item.name }}"
      namespace: kube-system
      kubeconfig: "{{ helm_kubeconfig_path }}"
      wait: true
      wait_condition:
          type: "Complete"
          status: "True"
      wait_timeout: "{{ [_helm_timeout_seconds | float | round(0, 'ceil') | int, helm_deployment_timeout | int] | max }}"
  vars:
      # The chart's own timeout bounds helm only; the Job also needs time to
      # schedule its pod and pull the image, hence helm_deployment_timeout
      # as the floor.
      _helm_timeout_seconds: >-
          {%- set ns = namespace(s=0) -%}
          {%- for n, u in item.timeout | default(helm_chart_defaults.timeout) | string
                         | regex_findall(helm_duration_part_pattern) -%}
          {%- set ns.s = ns.s + (n | float) * helm_duration_seconds_per_unit[u] -%}
          {%- endfor -%}
          {{ ns.s }}
      # The controller derives a new Job only from a changed spec, and it
      # does not write the spec itself (helm-controller chart.go only adds
      # its managed-by annotation). A changed spec therefore has to yield a
      # Job other than the one that existed before the deploy; otherwise the
      # wait would accept the previous, completed Job on an upgrade.
      # Top-level fields that are `false`, `""` or null render the same Job
      # as an unset field (`bootstrap` missing vs `bootstrap: false`), so
      # they are dropped before comparing. Without this, the role's own
      # explicit defaults count as a change, the controller keeps the Job,
      # and the wait never sees a new one. `false` is matched with `sameas`
      # so that a set `0` still counts (`backOffLimit` is a pointer, `0`
      # differs from unset), and `{}`/`[]` are kept because pointer structs
      # such as `podSecurityContext: {}` do change the Job.
      _helm_spec_before: >-
          {{ ((_helm_charts_before.results | selectattr('item.name', 'equalto', item.name)
              | map(attribute='resources') | first | default([], true) | first | default({})).spec
             | default({})) | dict2items | rejectattr('value', 'sameas', false)
             | rejectattr('value', 'in', ['', none]) | items2dict }}
      _helm_spec_after: >-
          {{ ((_helm_charts_deployment_result.results | selectattr('item.name', 'equalto', item.name)
              | map(attribute='result') | first | default({})).spec | default({}))
             | dict2items | rejectattr('value', 'sameas', false)
             | rejectattr('value', 'in', ['', none]) | items2dict }}
      _helm_job_uid_before: >-
          {{ _helm_jobs_before.results | selectattr('item.name', 'equalto', item.name)
             | map(attribute='resources') | first | default([], true)
             | map(attribute='metadata.uid') | first | default('') }}
  loop: "{{ helm_charts }}"
  loop_control:
      label: "{{ item.name }}"
  when:
      - helm_deployment_wait | bool
      # `default` guards the idempotence run: the deploy task above is tagged
      # molecule-idempotence-notest, so it is skipped there and never
      # registers its result.
      - _helm_charts_deployment_result | default({}) is changed
  register: _helm_install_job
  # A wait that ran into the timeout ends the loop: retrying it would
  # stretch a failing install to retries x timeout before it is reported.
  # Otherwise retry while the Job is missing or still the pre-deploy one.
  until: >-
      'even after waiting' in (_helm_install_job.msg | default(''))
      or (_helm_install_job.resources | default([]) | length == 1
          and (_helm_spec_before == _helm_spec_after
               or _helm_install_job.resources[0].metadata.uid != _helm_job_uid_before))
  retries: "{{ helm_validation_retries }}"
  delay: "{{ helm_validation_delay }}"

- name: "Display deployed Helm charts status"
  kubernetes.core.k8s_info:
      api_version: helm.cattle.io/v1
      kind: HelmChart
      namespace: kube-system
      name: "{{ item.name }}"
      kubeconfig: "{{ helm_kubeconfig_path }}"
  loop: "{{ helm_charts }}"
  when:
      - helm_charts | length > 0
  register: _helm_charts_status

- name: "Summary of Helm chart deployments"
  ansible.builtin.debug:
      msg: |
          Helm Chart Deployment Summary:
          {% for chart in helm_charts %}
          - {{ chart.name }}:
            * Namespace: {{ chart.namespace | default(helm_chart_defaults.namespace) }}
            * Chart: {{ chart.chart }}
            * Version: {{ chart.version | default('latest') }}
            * Bootstrap: {{ chart.bootstrap | default(false) }}
            * Repository: {{ chart.repository | default('default') }}
          {% endfor %}
  when:
      - helm_charts | length > 0
