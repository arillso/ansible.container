---
# Argument specifications for Helm role
# Defines and validates all input parameters for the role

argument_specs:
    main:
        short_description: "Deploy Helm charts to Kubernetes clusters"
        description: |
            This role manages Helm chart deployments to Kubernetes clusters.
            Supports repository management, chart installation, and validation.
        author: "Simon Bärlocher"
        options:
            helm_enable_charts:
                type: "bool"
                required: false
                default: false
                description: "Enable Helm chart deployment"

            helm_charts:
                type: "list"
                required: false
                default: []
                elements: "dict"
                description: |
                    List of Helm charts to deploy. Each chart requires:
                    - name: Chart release name
                    - chart: Chart name
                    - repository: Repository key from helm_repositories
                    - version: Chart version
                    - namespace: Target namespace
                    - create_namespace: Create namespace if missing
                    - values: Chart values override
                    - timeout: Duration such as 5m (default from helm_chart_defaults)
                    - bootstrap: Install as bootstrap chart (spec.bootstrap)

            helm_repositories:
                type: "dict"
                required: false
                default:
                    jetstack: "https://charts.jetstack.io"
                    bitnami: "https://charts.bitnami.com/bitnami"
                    prometheus-community: "https://prometheus-community.github.io/helm-charts"
                    grafana: "https://grafana.github.io/helm-charts"
                    ingress-nginx: "https://kubernetes.github.io/ingress-nginx"
                    traefik: "https://traefik.github.io/charts"
                    metallb: "https://metallb.github.io/metallb"
                description: |
                    Dictionary of Helm repositories.
                    Key is repository name, value is repository URL.
                    Overriding it replaces the whole dict; the defaults are
                    not merged in. A chart's `repository` must be a key here.

            helm_chart_defaults:
                type: "dict"
                required: false
                default:
                    namespace: "default"
                    create_namespace: false
                    timeout: "5m"
                description: "Default values for all chart deployments"
                options:
                    namespace:
                        type: "str"
                        default: "default"
                        description: "Default namespace for chart deployments"
                    create_namespace:
                        type: "bool"
                        default: false
                        description: "Create namespace if it doesn't exist"
                    timeout:
                        type: "str"
                        default: "5m"
                        description: |
                            Default timeout for Helm operations, as a duration such
                            as 5m, 1h or 1m30s. Also bounds each wait for the
                            install Job.

            helm_kubeconfig_path:
                type: "str"
                required: false
                default: ""
                description: |
                    Path to the kubeconfig file used for all Kubernetes calls.
                    Leave empty to autodetect the first existing file among
                    /etc/rancher/k3s/k3s.yaml,
                    /var/lib/rancher/k3s/server/cred/admin.kubeconfig,
                    /root/.kube/config and ~/.kube/config.

            helm_validation_retries:
                type: "int"
                required: false
                default: 10
                description: "Number of validation retry attempts"

            helm_validation_delay:
                type: "int"
                required: false
                default: 30
                description: "Delay between validation retries in seconds"

            helm_deployment_wait:
                type: "bool"
                required: false
                default: true
                description: "Wait for deployment to complete"

            helm_debug_enabled:
                type: "bool"
                required: false
                default: false
                description: "Enable debug output for Helm commands"
