---
- name: Converge
  hosts: all
  become: true
  vars:
      # Do not pin the plugin version. The role does resolve the pin at
      # runtime now (tasks/resolve_apt_version.yml), so a pin would work --
      # but Docker drops old releases from its repository, which would break
      # this scenario on a schedule nobody controls. The pinned branch is
      # covered by the apt_version_pin unit tests instead; an empty version
      # installs whatever the repo currently offers.
      docker_compose_v2_version: ""
      docker_compose_v2_project: "molecule"
      # Deploy a minimal compose project from a templated file so we
      # exercise both the systemd unit and the docker_compose_v2 module.
      docker_compose_v2_use_file: true
      docker_compose_v2_config:
          services:
              web:
                  # Pin the image by digest. `nginx:alpine` is an OCI image
                  # index with 16 manifests, and compose stores the resolved
                  # image ID in the `com.docker.compose.image` label. When the
                  # tag resolves to a different ID than the stored one, compose
                  # recreates the container even though the config hash still
                  # matches, and the idempotence step fails on the launch task.
                  # Renovate keeps the digest fresh through the molecule-image
                  # customManager in .github/renovate.json, which parses this
                  # `image:` line directly. A `# renovate:` comment here would
                  # be picked up by the comment manager in the shared preset
                  # instead, which reads the whole `nginx:alpine` as the tag
                  # and fails the registry lookup.
                  image: nginx:alpine@sha256:1d40e3eb3bf4f138de1d67193f2aa5309fcaf343eb5ffadbf5e9439de1eb1ebb
                  ports:
                      - "8080:80"
  tasks:
      - name: Include docker_compose_v2 role
        ansible.builtin.include_role:
            name: arillso.container.docker_compose_v2
