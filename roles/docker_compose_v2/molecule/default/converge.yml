---
- name: Converge
  hosts: all
  become: true
  vars:
      # Do not pin the plugin version: the pin is built as a bare
      # `docker-compose-plugin=<version>`, which apt matches against the full
      # version string (epoch and distro suffix) and therefore never resolves.
      # The docker role resolves that string at runtime; this role does not
      # yet, so an empty version installs whatever the repo currently offers.
      docker_compose_v2_version: ""
      docker_compose_v2_project: "molecule"
      # Deploy a minimal compose project from a templated file so we
      # exercise both the systemd unit and the docker_compose_v2 module.
      docker_compose_v2_use_file: true
      docker_compose_v2_config:
          services:
              web:
                  # Pin the image by digest. `nginx:alpine` is an OCI image
                  # index with 16 manifests, and compose stores the resolved
                  # image ID in the `com.docker.compose.image` label. When the
                  # tag resolves to a different ID than the stored one, compose
                  # recreates the container even though the config hash still
                  # matches, and the idempotence step fails on the launch task.
                  # renovate: datasource=docker depName=nginx versioning=docker
                  image: nginx:alpine@sha256:1d40e3eb3bf4f138de1d67193f2aa5309fcaf343eb5ffadbf5e9439de1eb1ebb
                  ports:
                      - "8080:80"
  tasks:
      - name: Include docker_compose_v2 role
        ansible.builtin.include_role:
            name: arillso.container.docker_compose_v2
