---
- name: Verify
  hosts: all
  become: true
  tasks:
      - name: Check the docker compose plugin is available
        ansible.builtin.command: docker compose version
        register: docker_compose_v2_version_out
        changed_when: false

      - name: Verify the compose plugin reports a version
        ansible.builtin.assert:
            that:
                - docker_compose_v2_version_out.rc == 0
                - "'Docker Compose version' in docker_compose_v2_version_out.stdout"
            fail_msg: "docker compose plugin is not installed"
            success_msg: "docker compose plugin is installed"

      - name: Check the generated compose project file exists
        ansible.builtin.stat:
            path: /etc/docker/compose/molecule/docker-compose.yml
        register: docker_compose_v2_file

      - name: Verify the compose project file was rendered
        ansible.builtin.assert:
            that:
                - docker_compose_v2_file.stat.exists
            fail_msg: "compose project file was not created"
            success_msg: "compose project file exists"

      - name: Read the state of the project systemd unit
        ansible.builtin.systemd_service:
            name: docker-compose-molecule.service
        register: docker_compose_v2_unit

      - name: Verify the project systemd unit is enabled and active
        ansible.builtin.assert:
            that:
                - docker_compose_v2_unit.status.UnitFileState == 'enabled'
                - docker_compose_v2_unit.status.ActiveState == 'active'
            fail_msg: >-
                docker-compose-molecule.service is
                {{ docker_compose_v2_unit.status.UnitFileState }}/{{ docker_compose_v2_unit.status.ActiveState }}
            success_msg: "docker-compose-molecule.service is enabled and active"

      - name: List running compose containers
        ansible.builtin.command: docker ps --filter "name=molecule" --format "{{ '{{' }}.Names{{ '}}' }}"
        register: docker_compose_v2_ps
        changed_when: false

      - name: Verify the compose project deployed a container
        ansible.builtin.assert:
            that:
                - docker_compose_v2_ps.stdout | length > 0
            fail_msg: "compose project did not start any containers"
            success_msg: "compose project started containers"

      # Teardown runs last: everything above asserts the created state, so
      # removing the project earlier (e.g. in side_effect.yml, which runs
      # before verify) would pull those assertions out from under themselves.
      - name: Tear the compose project down again
        ansible.builtin.include_role:
            name: arillso.container.docker_compose_v2
        vars:
            # Must match converge.yml: the role's install task runs on every
            # include, so a version that converge.yml does not also set would
            # reinstall the plugin here before reaching state=absent.
            docker_compose_v2_version: ""
            docker_compose_v2_project: "molecule"
            docker_compose_v2_use_file: true
            docker_compose_v2_state: absent
            docker_compose_v2_remove_volumes: true
            # No docker_compose_v2_config on purpose: state=absent must work
            # from the compose file converge.yml left on disk.

      - name: List compose containers after teardown
        ansible.builtin.command: docker ps --filter "name=molecule" --format "{{ '{{' }}.Names{{ '}}' }}"
        register: docker_compose_v2_ps_after
        changed_when: false

      - name: Verify the compose project was removed
        ansible.builtin.assert:
            that:
                - docker_compose_v2_ps_after.stdout | length == 0
            fail_msg: >-
                compose project still has running containers after
                state=absent: {{ docker_compose_v2_ps_after.stdout }}
            success_msg: "compose project was torn down correctly"

      - name: Check the project systemd unit after teardown
        ansible.builtin.stat:
            path: /etc/systemd/system/docker-compose-molecule.service
        register: docker_compose_v2_unit_after

      - name: Verify the project systemd unit was removed
        ansible.builtin.assert:
            that:
                - not docker_compose_v2_unit_after.stat.exists
            fail_msg: "docker-compose-molecule.service still exists after state=absent"
            success_msg: "docker-compose-molecule.service was removed"
