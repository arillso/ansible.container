---
# Docker Compose project file and project launch

# Earlier releases installed a docker-compose@.service template that called
# the Compose v1 binary and never worked. Remove it and any instance enabled
# by hand; restarts after a reboot come from `restart:` in the compose file.
- name: Find enabled legacy docker-compose@ instances
  ansible.builtin.find:
      paths: /etc/systemd/system/multi-user.target.wants
      patterns: "docker-compose@*.service"
      file_type: link
  register: docker_compose_v2_legacy_instances

- name: Remove the legacy docker-compose@ template unit and its instances
  become: true
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  loop: "{{ ['/etc/systemd/system/docker-compose@.service'] + (docker_compose_v2_legacy_instances.files | map(attribute='path') | list) }}"
  register: docker_compose_v2_legacy_unit

- name: Reload systemd after removing the legacy unit
  become: true
  ansible.builtin.systemd_service:
      daemon_reload: true
  when: docker_compose_v2_legacy_unit is changed

- name: Create Docker Compose configuration file from template
  become: true
  ansible.builtin.template:
      src: etc/docker/compose/docker-compose.yml.j2
      dest: "{{ docker_compose_v2_directory }}/docker-compose.yml"
      owner: root
      group: root
      mode: "0644"
  when:
      - docker_compose_v2_use_file
      - docker_compose_v2_config | length > 0

# state=absent without a definition works from the compose file of an earlier
# run. On a host the project never reached there is none, and the module would
# fail on an empty project_src instead of finding nothing to remove.
- name: Check for the Docker Compose project file
  ansible.builtin.stat:
      path: "{{ [docker_compose_v2_directory, docker_compose_v2_files | default([], true) | first | default('docker-compose.yml')] | path_join }}"
  register: docker_compose_v2_file_stat
  when:
      - docker_compose_v2_use_file
      - docker_compose_v2_state == 'absent'
      - docker_compose_v2_config | length == 0

- name: Launch Docker Compose based on specified configuration
  become: true
  community.docker.docker_compose_v2:
      project_src: "{{ docker_compose_v2_directory if docker_compose_v2_use_file else omit }}"
      definition: "{{ docker_compose_v2_config if not docker_compose_v2_use_file else omit }}"
      api_version: "{{ docker_compose_v2_api_version }}"
      dependencies: "{{ docker_compose_v2_dependencies }}"
      docker_host: "{{ docker_compose_v2_docker_host }}"
      env_files: "{{ docker_compose_v2_env_file | default(omit) }}"
      profiles: "{{ docker_compose_v2_profiles | default(omit) }}"
      project_name: "{{ docker_compose_v2_project_name | default(omit) }}"
      recreate: "{{ docker_compose_v2_recreate }}"
      remove_images: "{{ docker_compose_v2_remove_images | default(omit) }}"
      remove_orphans: "{{ docker_compose_v2_remove_orphans }}"
      remove_volumes: "{{ docker_compose_v2_remove_volumes }}"
      state: "{{ docker_compose_v2_state }}"
      timeout: "{{ docker_compose_v2_timeout | default(omit) }}"
      tls: "{{ docker_compose_v2_tls }}"
      tls_hostname: "{{ docker_compose_v2_tls_hostname | default(omit) }}"
      validate_certs: "{{ docker_compose_v2_validate_certs }}"
      cli_context: "{{ docker_compose_v2_cli_context | default(omit) }}"
      docker_cli: "{{ docker_compose_v2_docker_cli | default(omit) }}"
      build: "{{ docker_compose_v2_build | default(omit) }}"
      ca_path: "{{ docker_compose_v2_ca_path | default(docker_compose_v2_ca_cert) | default(omit) }}"
      client_cert: "{{ docker_compose_v2_client_cert | default(omit) }}"
      client_key: "{{ docker_compose_v2_client_key | default(omit) }}"
      files: "{{ docker_compose_v2_files | default(omit) }}"
      pull: "{{ docker_compose_v2_pull }}"
      scale: "{{ docker_compose_v2_scale | default(omit) }}"
      services: "{{ docker_compose_v2_services | default(omit) }}"
  when: docker_compose_v2_file_stat.stat.exists | default(true)
