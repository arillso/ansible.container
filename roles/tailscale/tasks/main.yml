---
# Tailscale Kubernetes Resources - Main Tasks
#
# ProxyGroups are applied after the Services and Ingresses that reference
# them through tailscale.com/proxy-group. On present the order does not
# matter, the operator reconciles a Service once its ProxyGroup exists. On
# absent the Services and Ingresses are deleted first, and every delete waits
# up to tailscale_wait_timeout, so a ProxyGroup is only removed after the
# operator released the objects that use it.

- name: Manage Tailscale service namespaces
  ansible.builtin.include_tasks: namespaces.yml
  when:
      - tailscale_state == "present"
      - (tailscale_ingress_services + tailscale_egress_services) | length > 0
  tags:
      - tailscale
      - tailscale-namespace
      - tailscale-ingress
      - tailscale-egress

- name: Manage Tailscale Ingress Services
  ansible.builtin.include_tasks: ingress_services.yml
  when: tailscale_ingress_services | length > 0
  tags:
      - tailscale
      - tailscale-ingress

- name: Manage Tailscale Egress Services
  ansible.builtin.include_tasks: egress_services.yml
  when: tailscale_egress_services | length > 0
  tags:
      - tailscale
      - tailscale-egress

- name: Manage Tailscale ProxyGroups
  ansible.builtin.include_tasks: proxygroups.yml
  when: tailscale_proxygroups | length > 0
  tags:
      - tailscale
      - tailscale-proxygroups
