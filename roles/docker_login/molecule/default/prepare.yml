---
# Full converge: docker_login needs a running Docker daemon and a
# registry to authenticate against. We install Docker via the docker
# role and spin up a throwaway local registry:2 container that the
# converge step then logs into.
- name: Prepare
  hosts: all
  become: true
  vars:
      # Do not pin docker-ce: this scenario is about docker_login, so it
      # takes whatever the upstream repo offers. The pinned branch is
      # covered statically by tests/unit/test_el_support.py.
      docker_version: ""
  tasks:
      - name: Install Docker
        ansible.builtin.include_role:
            name: arillso.container.docker

      # `package` cannot refresh apt metadata, so the Debian family needs
      # an explicit cache update before the install below.
      - name: Refresh apt cache on the Debian family
        ansible.builtin.apt:
            update_cache: true
        when: ansible_facts['os_family'] == "Debian"

      - name: Install pip (cloud image ships no pip3)
        ansible.builtin.package:
            name: python3-pip
            state: present

      - name: Install Python Docker SDK for community.docker modules
        ansible.builtin.pip:
            name: docker
            state: present

      - name: Run a throwaway local registry to authenticate against
        community.docker.docker_container:
            name: molecule-registry
            image: registry:2
            state: started
            restart_policy: "no"
            published_ports:
                - "5000:5000"

      - name: Wait for the local registry to accept connections
        ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 5000
            timeout: 60
