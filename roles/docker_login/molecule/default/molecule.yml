---
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: molecule-qemu

platforms:
    - name: docker-login-ubuntu-22.04
      image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
      image_checksum: sha256:https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2222
      network_ssh_user: ubuntu
      vm_cpus: 2
      vm_memory: 2048

    - name: docker-login-rocky-9
      image_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
      # Empty on purpose: the driver always passes image_checksum on to
      # get_url, so the key cannot be left out, and get_url treats an
      # empty value as "do not verify". Rocky's CHECKSUM file lists the
      # versioned image name, which never matches the `.latest.` URL
      # used here. Pin a literal sha256:<hash> against a versioned
      # image URL if verification is needed.
      image_checksum: ""
      # Log in as root. molecule-qemu renders the cloud-init user groups
      # from the *runner's* `ansible_os_family`, which is Debian on the
      # GitHub runner, so a non-root user on Rocky is created with
      # `admin`/`sudo` — neither group exists there, cloud-init aborts and
      # the SSH key is never installed. The root branch of the template
      # sets no groups and is unaffected.
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2223
      network_ssh_user: root
      vm_cpus: 2
      vm_memory: 2048

provisioner:
    name: ansible
    config_options:
        defaults:
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            docker-login-ubuntu-22.04:
                ansible_become: true
            docker-login-rocky-9:
                ansible_become: true
    playbooks:
        prepare: prepare.yml
        converge: converge.yml
        verify: verify.yml

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - side_effect
        - verify
        - cleanup
        - destroy
