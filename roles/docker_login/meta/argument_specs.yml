---
argument_specs:
    main:
        short_description: Manage Docker registry login using Ansible
        description:
            - This spec outlines parameters for managing Docker registry logins with Ansible.
            - It includes options for Docker API version, server verification certificates, and Docker host connection settings, along with login credentials.
        examples: |
            - hosts: servers
              become: true
              roles:
                  - role: arillso.container.docker_login
                    vars:
                        docker_login_registry_url: ghcr.io
                        docker_login_username: myuser
                        docker_login_password: "{{ vault_registry_token }}"

        options:
            docker_login_api_version:
                type: str
                description:
                    - Docker API version to use, set to 'auto' for automatic version selection.
                default: "auto"

            docker_login_ca_cert:
                type: str
                description:
                    - Path to the CA certificate for server verification.

            docker_login_client_cert:
                type: str
                description:
                    - Path to the client's TLS certificate for Docker daemon communication.

            docker_login_client_key:
                type: str
                description:
                    - Path to the client's TLS key for Docker daemon communication.

            docker_login_config_path:
                type: str
                description:
                    - Custom path to the Docker CLI configuration file.
                default: "~/.docker/config.json"

            docker_login_debug:
                type: bool
                description:
                    - Enable debug mode. Also disables no_log on the login task, so errors and the login result (including a registry identity token) are shown.
                default: false

            docker_login_docker_host:
                type: str
                description:
                    - Docker host URL or Unix socket path for API connection.
                default: "unix:///var/run/docker.sock"

            docker_login_password:
                type: str
                no_log: true
                description:
                    - The plaintext password for the registry account. Required when docker_login_state is 'present'.
                default: ""

            docker_login_reauthorize:
                type: bool
                description:
                    - Refresh existing authentication in the configuration file.
                default: false

            docker_login_registry_url:
                type: str
                description:
                    - The registry URL.
                default: "https://index.docker.io/v1/"

            docker_login_state:
                type: str
                description:
                    - Use present to log in and absent to log out. Logout needs only the registry URL.
                choices: ["present", "absent"]
                default: "present"

            docker_login_timeout:
                type: int
                description:
                    - Maximum time in seconds to wait for a response from the API.
                default: 60

            docker_login_tls:
                type: bool
                description:
                    - Use TLS for the connection to the Docker daemon API, without verifying the daemon's certificate.
                    - Does not affect the connection to the registry.
                default: false

            docker_login_tls_hostname:
                type: str
                description:
                    - Expected name of the Docker Host server for authenticity verification.

            docker_login_use_ssh_client:
                type: bool
                description:
                    - Use the SSH CLI tool instead of paramiko for SSH transports.
                default: false

            docker_login_username:
                type: str
                description:
                    - Username for the registry account. Required when docker_login_state is 'present'.
                default: ""

            docker_login_validate_certs:
                type: bool
                description:
                    - Use TLS for the connection to the Docker daemon API and verify the daemon's certificate.
                    - Does not affect the connection to the registry; registry TLS is configured on the Docker daemon.
                default: false
