---
# Fleet Workspaces management tasks

# FleetWorkspace (management.cattle.io/v3, Rancher only) has no spec and an
# empty status, so there is nothing to send beyond metadata and no condition
# to wait for.
- name: "Manage Fleet Workspaces"
  kubernetes.core.k8s:
      kubeconfig: "{{ fleet_kubeconfig_path }}"
      definition:
          apiVersion: "management.cattle.io/v3"
          kind: FleetWorkspace
          metadata:
              name: "{{ item.name }}"
              labels: "{{ item.labels | default({}) | combine({'app.kubernetes.io/managed-by': 'ansible', 'app.kubernetes.io/component': 'fleet-workspace'}) }}"
              annotations: "{{ item.annotations | default({}) }}"
      state: "{{ fleet_state }}"
  loop: "{{ fleet_workspaces }}"
  when: fleet_workspaces | length > 0
  register: fleet_workspace_results
  tags:
      - fleet
      - fleet-workspaces

- name: "Display Fleet Workspace creation results"
  ansible.builtin.debug:
      msg: "Workspace '{{ item.item.name }}' - State: {{ fleet_state }}"
  loop: "{{ fleet_workspace_results.results | default([]) }}"
  when:
      - fleet_workspace_results is defined
      - not ansible_check_mode
  tags:
      - fleet
      - fleet-workspaces
