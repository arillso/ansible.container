---
# Fleet Clusters management tasks

# Clusters with a kubeconfig_secret block on the Ready condition (up to
# wait_timeout each). See bundles.yml: these were fired via async/poll:0,
# which Ansible rejects for kubernetes.core.k8s, so the applies now run
# synchronously.
- name: "Manage Fleet Clusters"
  kubernetes.core.k8s:
      kubeconfig: "{{ fleet_kubeconfig_path }}"
      api_version: "{{ fleet_api_version }}"
      kind: Cluster
      name: "{{ item.name }}"
      namespace: "{{ item.namespace | default(fleet_defaults.namespace) }}"
      state: "{{ fleet_state }}"
      # Server-side apply and omitted optionals, as in bundles.yml: empty
      # values are dropped by the API and made every run report changed.
      apply: true
      definition:
          metadata:
              labels: "{{ item.labels | default({}) | combine({'app.kubernetes.io/managed-by': 'ansible', 'app.kubernetes.io/component': 'fleet-cluster'}) }}"
              annotations: "{{ item.annotations | default(omit) }}"
          # yamllint disable-line rule:line-length
          spec: "{{ omit if (item.kubeconfig_secret is not defined) else {'kubeConfigSecret': item.kubeconfig_secret, 'kubeConfigSecretNamespace': item.kubeconfig_secret_namespace | default(item.namespace | default(fleet_defaults.namespace)), 'clientID': item.client_id | default(omit), 'agentEnvVars': item.agent_env_vars | default(omit), 'agentNamespace': item.agent_namespace | default('fleet-system'), 'agentTLSMode': item.agent_tls_mode | default('system-store'), 'agentPrivateCA': item.agent_private_ca | default(omit), 'privateRepoURL': item.private_repo_url | default(omit), 'templateValues': item.template_values | default(omit)} }}"
      wait: "{{ omit if (item.kubeconfig_secret is not defined) else true }}"
      wait_condition: "{{ omit if (item.kubeconfig_secret is not defined) else {'type': 'Ready', 'status': 'True'} }}"
      wait_timeout: "{{ omit if (item.kubeconfig_secret is not defined) else fleet_resource_timeout }}"
  loop: "{{ fleet_clusters }}"
  when: fleet_clusters | length > 0
  register: fleet_cluster_results
  tags:
      - fleet
      - fleet-clusters

- name: "Display Fleet Cluster registration results"
  ansible.builtin.debug:
      msg: "Cluster '{{ item.item.name }}' in namespace '{{ item.item.namespace | default(fleet_defaults.namespace) }}' - State: {{ fleet_state }}"
  loop: "{{ fleet_cluster_results.results | default([]) }}"
  when:
      - fleet_cluster_results is defined
      - not ansible_check_mode
  tags:
      - fleet
      - fleet-clusters
