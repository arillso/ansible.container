---
# SYNTAX-ONLY scenario.
#
# The fleet role manages Rancher Fleet GitOps resources (GitRepo,
# Bundle, Cluster, Workspace, ClusterRegistrationToken CRDs) through a
# live Kubernetes API via kubernetes.core. It cannot converge without
# a running cluster with Fleet installed, and standing one up here
# would make this leg slow and flaky. We stop the test_sequence after
# `syntax`, which still catches playbook/role wiring and template
# errors cheaply. A full converge against a real cluster is deferred.
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: molecule-qemu

platforms:
    - name: fleet-ubuntu-22.04
      image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
      image_checksum: sha256:https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2222
      network_ssh_user: ubuntu
      vm_cpus: 2
      vm_memory: 2048

    - name: fleet-rocky-9
      image_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
      # The CHECKSUM index is BSD-style (`SHA256 (file) = hash`) and does
      # carry the `.latest.` name, so get_url resolves it directly.
      image_checksum: sha256:https://dl.rockylinux.org/pub/rocky/9/images/x86_64/CHECKSUM
      # Log in as root. molecule-qemu renders the cloud-init user groups
      # from the *runner's* `ansible_os_family`, which is Debian on the
      # GitHub runner, so a non-root user on Rocky is created with
      # `admin`/`sudo` — neither group exists there, cloud-init aborts and
      # the SSH key is never installed. The root branch of the template
      # sets no groups and is unaffected.
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2223
      network_ssh_user: root
      # The GenericCloud image is a 10 GiB qcow2 and the driver's 8G
      # default truncates the overlay, so the root partition never
      # shows up and dracut drops to the emergency shell.
      vm_disk: 16G
      vm_cpus: 2
      vm_memory: 2048

provisioner:
    name: ansible
    config_options:
        defaults:
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            fleet-ubuntu-22.04:
                ansible_become: true
            fleet-rocky-9:
                ansible_become: true
    playbooks:
        converge: converge.yml
        verify: verify.yml

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - cleanup
        - destroy
