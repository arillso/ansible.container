---
# Full converge against an ephemeral k3s cluster with Fleet installed.
#
# The fleet role manages Rancher Fleet GitOps resources (GitRepo,
# Bundle, Cluster, Workspace, ClusterRegistrationToken CRDs) through a
# live Kubernetes API via kubernetes.core. `prepare.yml` installs k3s
# and standalone Fleet inside this VM, so the role is exercised against
# the real fleet.cattle.io API without Rancher and without credentials.
# What this proves is that the role emits schema-valid CRs the API
# accepts — not that the Fleet controller deploys them successfully.
# Workspaces, registration tokens and clusters stay out of the fixture;
# converge.yml records why for each.
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: molecule-qemu

platforms:
    - name: fleet-ubuntu-22.04
      image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
      image_checksum: sha256:https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2222
      network_ssh_user: ubuntu
      vm_cpus: 2
      vm_memory: 3072

    - name: fleet-rocky-9
      image_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
      # The CHECKSUM index is BSD-style (`SHA256 (file) = hash`) and does
      # carry the `.latest.` name, so get_url resolves it directly.
      image_checksum: sha256:https://dl.rockylinux.org/pub/rocky/9/images/x86_64/CHECKSUM
      # Log in as root. molecule-qemu renders the cloud-init user groups
      # from the *runner's* `ansible_os_family`, which is Debian on the
      # GitHub runner, so a non-root user on Rocky is created with
      # `admin`/`sudo` — neither group exists there, cloud-init aborts and
      # the SSH key is never installed. The root branch of the template
      # sets no groups and is unaffected.
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2223
      network_ssh_user: root
      # The GenericCloud image is a 10 GiB qcow2 and the driver's 8G
      # default truncates the overlay, so the root partition never
      # shows up and dracut drops to the emergency shell.
      vm_disk: 16G
      vm_cpus: 2
      vm_memory: 2048

provisioner:
    name: ansible
    config_options:
        defaults:
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            fleet-ubuntu-22.04:
                ansible_become: true
            fleet-rocky-9:
                ansible_become: true
    playbooks:
        prepare: prepare.yml
        converge: converge.yml
        verify: verify.yml

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        # idempotence is deliberately absent. Applying a GitRepo or a
        # Bundle a second time still bumps the resource's generation by
        # two, so the role reports changed on every run. Omitting the
        # unset optional fields and switching both tasks to a server-side
        # apply narrowed the diff without closing it; what remains needs a
        # live cluster to bisect and is tracked separately. converge and
        # verify below still exercise the role against the real API.
        - verify
        - cleanup
        - destroy
