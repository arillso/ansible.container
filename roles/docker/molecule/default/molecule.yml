---
dependency:
    name: galaxy
    options:
        requirements-file: requirements.yml

driver:
    name: molecule-qemu

platforms:
    - name: docker-ubuntu-22.04
      image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
      image_checksum: sha256:https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2222
      network_ssh_user: ubuntu
      vm_cpus: 2
      vm_memory: 2048

    - name: docker-debian-12
      image_url: https://cloud.debian.org/images/cloud/bookworm/latest/debian-12-genericcloud-amd64.qcow2
      image_checksum: sha512:https://cloud.debian.org/images/cloud/bookworm/latest/SHA512SUMS
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2223
      network_ssh_user: debian
      vm_cpus: 2
      vm_memory: 2048

    - name: docker-rocky-9
      image_url: https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
      # No image_checksum: Rocky publishes BSD-style CHECKSUM files
      # (`SHA256 (file) = <hash>`), which get_url's checksum-by-URL
      # only understands in GNU coreutils format. The `.latest.`
      # image is a moving target, so a literal hash would go stale
      # at the next respin; pin one here if verification is needed.
      image_arch: x86_64
      network_mode: user
      network_ssh_port: 2224
      network_ssh_user: rocky
      vm_cpus: 2
      vm_memory: 2048

provisioner:
    name: ansible
    config_options:
        defaults:
            callbacks_enabled: profile_tasks, timer
            stdout_callback: ansible.builtin.default
            result_format: yaml
    inventory:
        host_vars:
            docker-ubuntu-22.04:
                ansible_become: true
            docker-debian-12:
                ansible_become: true
            docker-rocky-9:
                ansible_become: true
    playbooks:
        converge: converge.yml
        verify: verify.yml

verifier:
    name: ansible

scenario:
    name: default
    test_sequence:
        - dependency
        - cleanup
        - destroy
        - syntax
        - create
        - prepare
        - converge
        - idempotence
        - side_effect
        - verify
        - cleanup
        - destroy
