---
# Diagnostic only: the Rocky platform boots but never opens SSH, so
# `create` dies before any play reaches the guest. Molecule still runs
# `cleanup` on that failure, which makes it the only hook that can
# surface the serial console captured via `vm_extra_args`.
# Remove together with that `-serial` argument once the boot failure is
# understood.
- name: Cleanup
  hosts: localhost
  gather_facts: false
  tasks:
      - name: Read the Rocky serial console
        ansible.builtin.slurp:
            src: /tmp/molecule-console-docker-rocky-9.log
        register: rocky_console
        failed_when: false

      - name: Show the Rocky serial console
        ansible.builtin.debug:
            msg: "{{ (rocky_console.content | b64decode).split('\n') }}"
        when: rocky_console.content is defined
