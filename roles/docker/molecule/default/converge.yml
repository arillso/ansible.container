---
- name: Converge
  hosts: all
  become: true
  vars:
      # Install whatever docker-ce the upstream repo currently offers, which
      # is the unpinned branch of the docker_package expression. Left empty
      # for every platform so the matrix exercises one code path. The pinned
      # branch is covered statically by tests/unit/test_el_support.py; running
      # it here would tie CI to a version Docker can drop from its repository
      # at any time.
      docker_version: ""
      # Recursion is only observable when the same nested key exists on BOTH
      # sides of the merge. The shipped docker_daemon_base has no log-opts, so
      # putting log-opts only in docker_daemon renders identically with
      # recursive=True and recursive=False -- an assertion on that can never
      # fail. The base is therefore overridden here (a documented hook, see
      # roles/docker/README.md) to carry its own log-opts sub-key, rather than
      # adding a default that would only exist for the test.
      docker_daemon_base:
          log-driver: journald
          live-restore: true
          no-new-privileges: true
          log-opts:
              labels: "from-base"
      docker_daemon:
          log-driver: json-file
          log-opts:
              max-size: "10m"
              max-file: "3"
          storage-driver: overlay2
          features:
              buildkit: true
  tasks:
      - name: Include docker role
        ansible.builtin.include_role:
            name: arillso.container.docker
