---
- name: Verify
  hosts: all
  become: true
  # Read the pin from the role defaults instead of hard-coding it here, so a
  # Renovate bump of docker_version does not need a second edit in this file.
  vars_files:
      - ../../defaults/main.yml
  tasks:
      - name: Query the installed Docker version
        ansible.builtin.command: docker version --format '{{ '{{' }}.Server.Version{{ '}}' }}'
        register: docker_server_version
        changed_when: false

      - name: Verify the installed version equals the pinned default
        ansible.builtin.assert:
            that:
                - docker_server_version.stdout | trim == docker_version
            fail_msg: >-
                Installed Docker {{ docker_server_version.stdout | trim }}
                does not match the pinned default {{ docker_version }}
            success_msg: "Pinned Docker {{ docker_version }} is installed"

      - name: Check Docker service status
        ansible.builtin.service:
            name: docker
            state: started
        check_mode: true
        register: docker_service

      - name: Verify Docker service is running
        ansible.builtin.assert:
            that:
                - not docker_service.changed
            fail_msg: "Docker service is not running"
            success_msg: "Docker service is running"
