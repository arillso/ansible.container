---
argument_specs:
    main:
        short_description: Configure and manage Docker environment using Ansible
        description:
            - This spec defines the parameters for configuring Docker and its environment on various distributions using Ansible.
        options:
            docker_version:
                type: str
                description: Specifies the version of Docker to be installed. If omitted, the latest version is installed.
                # renovate: datasource=github-releases depName=moby/moby
                default: "28.5.2"

            docker_daemon_base:
                type: dict
                description: >-
                    Role-provided base for the Docker daemon configuration. The rendered
                    /etc/docker/daemon.json is docker_daemon_base recursively merged with
                    docker_daemon. Override individual keys via docker_daemon rather than
                    replacing this dict.
                default:
                    log-driver: journald
                    live-restore: true
                    no-new-privileges: true

            docker_daemon:
                type: dict
                description: >-
                    User-provided Docker daemon configuration options, merged recursively on
                    top of docker_daemon_base. Keys set here win; keys left unset are
                    inherited from the base. Any daemon.json key is accepted; the rendered
                    file is checked with `dockerd --validate` before it replaces the
                    current one, so a wrong key or value type fails the task instead
                    of the daemon restart. On a
                    swarm node live-restore is forced to false, because the swarm
                    cluster component fails to start with it.
                default: {}

            docker_prune_enabled:
                type: bool
                default: true
                description: >-
                    Install and run the prune timers from docker_systemd_units. false
                    stops and disables them.

            docker_systemd_units:
                type: list
                elements: dict
                description: >-
                    Systemd units to create for Docker pruning, in the
                    arillso.system.systemd `systemd_units` format.
                default:
                    - name: docker-prune.service
                      unit:
                          Unit:
                              Description: Docker System Prune Service
                          Service:
                              Type: oneshot
                              ExecStart: "/usr/bin/docker system prune -af --filter 'until=24h'"
                    - name: docker-prune.timer
                      unit:
                          Unit:
                              Description: Run docker system prune daily
                          Timer:
                              OnCalendar: daily
                              Persistent: true
                          Install:
                              WantedBy: timers.target
                    - name: docker-prune-volumes.service
                      unit:
                          Unit:
                              Description: Docker System Prune with Volumes Service
                          Service:
                              Type: oneshot
                              ExecStart: "/usr/bin/docker system prune -af --volumes"
                    - name: docker-prune-volumes.timer
                      unit:
                          Unit:
                              Description: Run docker system prune with volumes weekly
                          Timer:
                              OnCalendar: weekly
                              Persistent: true
                          Install:
                              WantedBy: timers.target
                options:
                    name:
                        type: str
                        required: true
                        description: Full unit filename, including the .service/.timer suffix.
                    unit:
                        type: dict
                        description: >-
                            Structured unit definition as {Section: {Key: Value}};
                            rendered to an INI unit file by the systemd role.
