---
# Docker daemon configuration

- name: Create docker directory
  become: true
  ansible.builtin.file:
      path: "{{ item }}"
      state: directory
      owner: root
      group: root
      mode: "0700"
  with_items:
      - "/etc/docker"

# Read by templates/etc/docker/daemon.json.j2 to drop live-restore on swarm
# nodes. A daemon that is not running yet (first install on EL) reports no
# state, which counts as not in a swarm. A node whose cluster component failed
# to start because of live-restore reports `error`, so that state counts too.
# ponytail: a later `docker swarm init` is not seen until the next role run
- name: Read the swarm state
  become: true
  ansible.builtin.command:
      argv:
          - docker
          - info
          - --format
          - "{{ '{{' }}.Swarm.LocalNodeState{{ '}}' }}"
  register: docker_swarm_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Configure docker daemon
  become: true
  ansible.builtin.template:
      backup: true
      src: etc/docker/daemon.json.j2
      dest: /etc/docker/daemon.json
      mode: "0600"
      owner: root
      group: root
  notify:
      - Restart docker
