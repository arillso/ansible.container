---
# Docker prune service and timer units

- name: Create Docker Prune Service and Timer Files
  ansible.builtin.include_role:
      name: arillso.system.systemd
  vars:
      # Only the unit-file entry point; service/journald management stays
      # off so this call just writes the prune unit files.
      systemd_service_enabled: false
      systemd_journald_enabled: false
      systemd_units: "{{ docker_systemd_units }}"
  when: docker_prune_enabled

# /etc/systemd/system is where arillso.system.systemd writes units
# (systemd_unit_path default). Checked so that docker_prune_enabled: false
# only touches timers a previous run installed.
- name: Find installed Docker prune units
  ansible.builtin.stat:
      path: "/etc/systemd/system/{{ item.name }}"
  loop: "{{ docker_systemd_units }}"
  register: docker_prune_unit_files

- name: Enable and start systemd timers for Docker
  become: true
  ansible.builtin.systemd:
      name: "{{ item.item.name }}"
      enabled: "{{ docker_prune_enabled }}"
      state: "{{ 'started' if docker_prune_enabled else 'stopped' }}"
      daemon_reload: true
  loop: "{{ docker_prune_unit_files.results }}"
  loop_control:
      label: "{{ item.item.name }}"
  when:
      - item.item.name is search('\.timer$')
      - docker_prune_enabled or item.stat.exists

- name: Remove Docker prune units
  become: true
  ansible.builtin.file:
      path: "/etc/systemd/system/{{ item.item.name }}"
      state: absent
  loop: "{{ docker_prune_unit_files.results }}"
  loop_control:
      label: "{{ item.item.name }}"
  when:
      - not docker_prune_enabled
      - item.stat.exists
  register: docker_prune_units_removed

- name: Reload systemd after removing the prune units
  become: true
  ansible.builtin.systemd:
      daemon_reload: true
  when: docker_prune_units_removed is changed
