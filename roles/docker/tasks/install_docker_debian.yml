---
# Shared by Debian and Ubuntu: Ubuntu has no file of its own and reaches this
# one through the os_family fallback in tasks/main.yml. docker_apt_distribution
# (vars/Debian.yml) picks the Docker repository the host belongs to.

- name: "Debian : ensure deb822 dependency"
  become: true
  ansible.builtin.apt:
      name: python3-debian
      state: present
      update_cache: true
      cache_valid_time: 3600

# Earlier releases wrote the source list and the key to these paths; the
# deb822 repository below replaces all of them.
- name: "Debian : remove legacy docker sources and keys"
  become: true
  ansible.builtin.file:
      path: "{{ item }}"
      state: absent
  loop:
      - /etc/apt/sources.list.d/docker.list
      - /etc/apt/trusted.gpg.d/docker.asc
      - /usr/share/keyrings/docker-archive-keyring.asc

- name: "Debian : create keyrings directory"
  become: true
  ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

# force: true re-downloads on every run but only reports a change when the
# content differs, so a key rotated by Docker is picked up.
- name: "Debian : add key"
  become: true
  ansible.builtin.get_url:
      url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
      dest: /etc/apt/keyrings/docker.asc
      mode: "0644"
      force: true

# No `architectures:` -- apt then uses the host's native architecture, so
# arm64 hosts get the arm64 packages.
- name: "Debian : add repository"
  become: true
  ansible.builtin.deb822_repository:
      name: docker
      types: deb
      signed_by: /etc/apt/keyrings/docker.asc
      uris: "https://download.docker.com/linux/{{ docker_apt_distribution }}"
      suites: "{{ ansible_facts['distribution_release'] }}"
      components: stable
      state: present
      enabled: true
  register: docker_repo

- name: "Debian : update apt cache"
  become: true
  ansible.builtin.apt:
      update_cache: true
  when: docker_repo is changed

# apt matches an "=" pin against the full version string (epoch + distro
# suffix) and does not expand globs in it, so the exact candidate has to be
# looked up on the host. madison prints "<pkg> | <version> | <repo>", so the
# middle field is taken and matched on "(^|:)<version>-": the version either
# opens the string or follows the epoch colon, and the trailing hyphen keeps
# 29.7.1 from taking 29.7.10 and rejects a bare prefix like "29.7". docker-ce
# currently always carries an epoch, but docker-compose-plugin in the same
# repository does not, so the epoch is matched as optional rather than
# assumed. The matching lives in the apt_version_pin filter, which keeps the
# regex out of YAML -- in a bare `when:` Jinja consumes its backslashes
# differently and silently turns the guard below into a no-op.
- name: "Debian : resolve the apt version string for the pin"
  ansible.builtin.command:
      cmd: apt-cache madison docker-ce
  register: docker_madison
  changed_when: false
  when: docker_version != ''

- name: "Debian : set the resolved apt version string"
  ansible.builtin.set_fact:
      docker_apt_version: >-
          {{ docker_madison.stdout_lines
             | arillso.container.apt_version_pin(docker_version)
             | default('', true) }}
  when: docker_version != ''

- name: "Debian : fail when the pinned docker version is not in the repository"
  ansible.builtin.fail:
      msg: >-
          docker_version {{ docker_version }} is not available as a docker-ce
          package for {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_release'] }}. Docker drops old
          packages from its repository, so an exact pin stops resolving once
          the release is removed.
  when:
      - docker_version != ''
      - docker_apt_version | length == 0
