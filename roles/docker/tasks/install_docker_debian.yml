---
- name: "Debian : ensure deb822 dependency"
  become: true
  ansible.builtin.apt:
      name: python3-debian
      state: present
      update_cache: true

- name: "Debian : remove legacy docker.list"
  become: true
  ansible.builtin.file:
      path: /etc/apt/sources.list.d/docker.list
      state: absent

- name: "Debian : add key"
  become: true
  ansible.builtin.get_url:
      url: https://download.docker.com/linux/debian/gpg
      dest: /usr/share/keyrings/docker-archive-keyring.asc
      mode: "0644"
      force: true

- name: "Debian : add repository"
  become: true
  ansible.builtin.deb822_repository:
      name: docker
      types: deb
      architectures: amd64
      signed_by: /usr/share/keyrings/docker-archive-keyring.asc
      uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
      suites: "{{ ansible_facts['distribution_release'] }}"
      components: stable
      state: present
      enabled: true
  register: docker_repo

- name: "Debian : update apt cache"
  become: true
  ansible.builtin.apt:
      update_cache: true
  when: docker_repo is changed

# apt matches an "=" pin against the full version string (epoch + distro
# suffix) and does not expand globs in it, so the exact candidate has to be
# looked up on the host. madison prints "<pkg> | <version> | <repo>", so the
# middle field is taken and matched on "(^|:)<version>-": the version either
# opens the string or follows the epoch colon, and the trailing hyphen keeps
# 29.7.1 from taking 29.7.10 and rejects a bare prefix like "29.7". docker-ce
# currently always carries an epoch, but docker-compose-plugin in the same
# repository does not, so the epoch is matched as optional rather than
# assumed. regex_escape keeps the dots literal; without it "29.7.1" would
# also match a "29X7X1" build.
- name: "Debian : resolve the apt version string for the pin"
  ansible.builtin.command:
      cmd: apt-cache madison docker-ce
  register: docker_madison
  changed_when: false
  when: docker_version != ''

# The match is resolved inside {{ }} rather than in a bare `when:`, because
# `when` evaluates its argument as raw Jinja and consumes the backslashes of
# the regex differently, which silently turns the guard below into a no-op.
- name: "Debian : collect the matching apt version strings"
  ansible.builtin.set_fact:
      docker_apt_candidates: >-
          {{ docker_madison.stdout_lines
             | map('regex_replace', '^[^|]*\|\s*([^|]+?)\s*\|.*$', '\1')
             | select('search', '(^|:)' ~ (docker_version | regex_escape) ~ '-')
             | list }}
  when: docker_version != ''

- name: "Debian : fail when the pinned docker version is not in the repository"
  ansible.builtin.fail:
      msg: >-
          docker_version {{ docker_version }} is not available as a docker-ce
          package for {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_release'] }}. Docker drops old
          packages from its repository, so an exact pin stops resolving once
          the release is removed.
  when:
      - docker_version != ''
      - docker_apt_candidates | length == 0

- name: "Debian : set the resolved apt version string"
  ansible.builtin.set_fact:
      docker_apt_version: "{{ docker_apt_candidates | first }}"
  when: docker_version != ''
