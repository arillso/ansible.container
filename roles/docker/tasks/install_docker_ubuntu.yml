---
- name: "Ubuntu : create keyrings directory"
  become: true
  ansible.builtin.file:
      path: /etc/apt/keyrings
      state: directory
      mode: "0755"

- name: "Ubuntu : ensure deb822 dependency"
  become: true
  ansible.builtin.apt:
      name: python3-debian
      state: present
      update_cache: true

- name: "Ubuntu : remove legacy GPG key"
  become: true
  ansible.builtin.file:
      path: /etc/apt/trusted.gpg.d/docker.asc
      state: absent

- name: "Ubuntu : remove legacy docker.list"
  become: true
  ansible.builtin.file:
      path: /etc/apt/sources.list.d/docker.list
      state: absent

- name: "Ubuntu : add key"
  ansible.builtin.get_url:
      url: "https://download.docker.com/linux/ubuntu/gpg"
      dest: /etc/apt/keyrings/docker.asc
      mode: "0644"
      force: false

- name: "Ubuntu : add repository"
  become: true
  ansible.builtin.deb822_repository:
      name: docker
      types: deb
      architectures: amd64
      signed_by: /etc/apt/keyrings/docker.asc
      uris: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}"
      suites: "{{ ansible_facts['distribution_release'] }}"
      components: stable
      state: present
      enabled: true
  register: docker_repo

- name: "Ubuntu : update apt cache"
  become: true
  ansible.builtin.apt:
      update_cache: true
  when: docker_repo is changed

# apt matches an "=" pin against the full version string (epoch + distro
# suffix) and does not expand globs in it, so the exact candidate has to be
# looked up on the host. madison prints "<pkg> | <version> | <repo>", so the
# middle field is taken and matched on "(^|:)<version>-": the version either
# opens the string or follows the epoch colon, and the trailing hyphen keeps
# 29.7.1 from taking 29.7.10 and rejects a bare prefix like "29.7". docker-ce
# currently always carries an epoch, but docker-compose-plugin in the same
# repository does not, so the epoch is matched as optional rather than
# assumed. The matching lives in the apt_version_pin filter, which keeps the
# regex out of YAML -- in a bare `when:` Jinja consumes its backslashes
# differently and silently turns the guard below into a no-op.
- name: "Ubuntu : resolve the apt version string for the pin"
  ansible.builtin.command:
      cmd: apt-cache madison docker-ce
  register: docker_madison
  changed_when: false
  when: docker_version != ''

- name: "Ubuntu : set the resolved apt version string"
  ansible.builtin.set_fact:
      docker_apt_version: >-
          {{ docker_madison.stdout_lines
             | arillso.container.apt_version_pin(docker_version)
             | default('', true) }}
  when: docker_version != ''

- name: "Ubuntu : fail when the pinned docker version is not in the repository"
  ansible.builtin.fail:
      msg: >-
          docker_version {{ docker_version }} is not available as a docker-ce
          package for {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_release'] }}. Docker drops old
          packages from its repository, so an exact pin stops resolving once
          the release is removed.
  when:
      - docker_version != ''
      - docker_apt_version | length == 0
