---
# Covers the whole RedHat family (Rocky, AlmaLinux, RHEL, CentOS) via the
# os_family fallback in tasks/main.yml. RPM version strings carry an epoch
# and a release part (e.g. 3:<version>-1.el9), which a bare
# "docker-ce-<version>" never matches, so the pin uses a wildcard suffix.
docker_package:
    - "{{ 'docker-ce-' + docker_version + '*' if docker_version != '' else 'docker-ce' }}"
    # The EL repos ship no python3-docker; the Docker SDK is installed via
    # pip where a role or scenario needs it (see docker_login prepare).
    - python3-pip
