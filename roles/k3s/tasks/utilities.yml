---
# K3s Utilities and Symlinks Configuration
# Post-installation tasks for K3s utility commands and helper scripts
# Requires K3s binary to be installed and available at /usr/local/bin/k3s

- name: Verify K3s binary is installed
  ansible.builtin.stat:
      path: /usr/local/bin/k3s
  register: _k3s_binary_check

- name: Fail if K3s binary is not found
  ansible.builtin.fail:
      msg: "K3s binary not found at /usr/local/bin/k3s. This task file should only run after K3s installation."
  when: not _k3s_binary_check.stat.exists

- name: Create K3s utility symlinks
  ansible.builtin.file:
      src: /usr/local/bin/k3s
      dest: "/usr/local/bin/{{ item }}"
      state: link
      owner: root
      group: root
  loop: "{{ k3s_symlink_commands }}"
  become: true
  when:
      - k3s_create_symlinks | bool

- name: Create K3s environment configuration file
  ansible.builtin.template:
      src: etc/systemd/system/k3s.service.env.j2
      dest: /etc/systemd/system/k3s.service.env
      mode: "0600"
      owner: root
      group: root
  become: true
  register: _k3s_env_file_result
  notify: Restart k3s
  when: k3s_environment_vars | length > 0

# This file is included after main.yml has already flushed its handlers and
# waited for the API server, so a restart notified here would otherwise fire at
# the end of the play, leaving following plays to hit a server still coming up.
- name: Flush handlers to apply the environment file restart
  ansible.builtin.meta: flush_handlers

- name: Wait for k3s to be ready after the environment file restart
  ansible.builtin.wait_for:
      port: "{{ k3s_https_listen_port }}"
      host: "{{ k3s_health_check_host }}"
      delay: "{{ k3s_health_check_delay }}"
      timeout: "{{ k3s_health_check_timeout }}"
      sleep: "{{ k3s_health_check_sleep }}"
  when:
      - k3s_role == "server"
      - _k3s_env_file_result.changed | default(false)

- name: Create bash completion directory
  ansible.builtin.file:
      path: /etc/bash_completion.d
      state: directory
      mode: "0755"
      owner: root
      group: root
  become: true
  when:
      - k3s_create_bash_completion | default(true) | bool
      - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Generate K3s bash completion
  ansible.builtin.command:
      cmd: /usr/local/bin/k3s completion bash
  become: true
  register: _k3s_completion_test
  changed_when: false
  failed_when: false
  when:
      - k3s_create_bash_completion | default(true) | bool
      - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Create K3s bash completion
  ansible.builtin.copy:
      content: "{{ _k3s_completion_test.stdout }}\n"
      dest: /etc/bash_completion.d/k3s
      mode: "0644"
      owner: root
      group: root
  become: true
  when:
      - k3s_create_bash_completion | default(true) | bool
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
      - _k3s_completion_test.rc is defined
      - _k3s_completion_test.rc == 0

- name: Generate kubectl bash completion
  ansible.builtin.command:
      cmd: /usr/local/bin/kubectl completion bash
  become: true
  register: _k3s_kubectl_completion_test
  changed_when: false
  failed_when: false
  when:
      - k3s_create_bash_completion | default(true) | bool
      - k3s_create_symlinks | bool
      - "'kubectl' in k3s_symlink_commands"
      - ansible_facts['os_family'] in ['Debian', 'RedHat']

- name: Create kubectl bash completion (if kubectl symlink exists)
  ansible.builtin.copy:
      content: "{{ _k3s_kubectl_completion_test.stdout }}\n"
      dest: /etc/bash_completion.d/kubectl
      mode: "0644"
      owner: root
      group: root
  become: true
  when:
      - k3s_create_bash_completion | default(true) | bool
      - k3s_create_symlinks | bool
      - "'kubectl' in k3s_symlink_commands"
      - ansible_facts['os_family'] in ['Debian', 'RedHat']
      - _k3s_kubectl_completion_test.rc is defined
      - _k3s_kubectl_completion_test.rc == 0
