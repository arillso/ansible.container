---
# Upgrade path validation and checksum-verified binary installation

# K3s upgrade path validation - only one minor version step allowed
- name: Validate k3s upgrade path
  vars:
      current_minor: "{{ ansible_facts['ansible_local']['k3s'].service.version | regex_replace('^v\\d+\\.(\\d+)\\..*', '\\1') | int }}"
      target_minor: "{{ k3s_version | regex_replace('^v\\d+\\.(\\d+)\\..*', '\\1') | int }}"
  ansible.builtin.assert:
      that:
          - (target_minor | int) >= (current_minor | int)
          - (target_minor | int) - (current_minor | int) <= 1
      fail_msg: >-
          K3s version change not allowed from
          {{ ansible_facts['ansible_local']['k3s'].service.version }} to {{ k3s_version }}.
          Downgrades are not supported. Upgrades must be one minor version at a time.
  when:
      - ansible_facts['ansible_local']['k3s'].service.binary_installed | bool
      - ansible_facts['ansible_local']['k3s'].service.version | default('unknown') != 'unknown'
      - ansible_facts['ansible_local']['k3s'].service.version != k3s_version

# K3s binary installation - checksum-verified download
- name: Download k3s SHA256 checksum file
  ansible.builtin.get_url:
      url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/sha256sum-{{ k3s_arch }}.txt"
      dest: "/tmp/k3s-sha256sum-{{ k3s_version }}.txt"
      mode: "0644"
      force: true
  become: true
  when: >-
      (not ansible_facts['ansible_local']['k3s'].service.binary_installed | bool
      or ansible_facts['ansible_local']['k3s'].service.version != k3s_version)
      and not k3s_binary_checksum

- name: Extract k3s binary checksum from release file
  ansible.builtin.shell:
      cmd: "set -o pipefail && grep ' k3s{{ k3s_suffix | default('') }}$' /tmp/k3s-sha256sum-{{ k3s_version }}.txt | awk '{print $1}'"
      executable: /bin/bash
  register: _k3s_release_checksum
  changed_when: false
  become: true
  when: >-
      (not ansible_facts['ansible_local']['k3s'].service.binary_installed | bool
      or ansible_facts['ansible_local']['k3s'].service.version != k3s_version)
      and not k3s_binary_checksum

- name: Download k3s binary
  ansible.builtin.get_url:
      url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version }}/k3s{{ k3s_suffix | default('') }}"
      dest: "/usr/local/bin/k3s"
      mode: "0755"
      owner: root
      group: root
      checksum: "sha256:{{ k3s_binary_checksum if k3s_binary_checksum else _k3s_release_checksum.stdout }}"
  become: true
  when: >-
      not ansible_facts['ansible_local']['k3s'].service.binary_installed | bool
      or ansible_facts['ansible_local']['k3s'].service.version != k3s_version
  notify: Restart k3s

# The sefcontext rule is written in security.yml, which runs before this
# download, so the freshly fetched binary still carries the default label
# for /usr/local/bin and has to be relabelled here.
- name: Apply SELinux context to k3s binary
  ansible.builtin.command: restorecon -v /usr/local/bin/k3s
  become: true
  register: _k3s_selinux_restorecon
  changed_when: "'restorecon reset' in _k3s_selinux_restorecon.stdout"
  when:
      - ansible_facts['os_family'] == "RedHat"
      - k3s_security_hardening | default(true) | bool
