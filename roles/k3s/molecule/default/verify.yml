---
- name: Verify
  hosts: all
  become: true
  tasks:
      - name: Wait for k3s service to be ready
        ansible.builtin.wait_for:
            path: /etc/rancher/k3s/k3s.yaml
            state: present
            timeout: 300

      - name: Check if k3s is installed
        ansible.builtin.command: k3s --version
        register: k3s_cli_version
        changed_when: false

      - name: Verify k3s version output
        ansible.builtin.assert:
            that:
                - k3s_cli_version.rc == 0
                - "'k3s version' in k3s_cli_version.stdout"
            fail_msg: "K3s is not properly installed"
            success_msg: "K3s is installed correctly"

      - name: Check k3s service status
        ansible.builtin.service:
            name: k3s
            state: started
        check_mode: true
        register: k3s_service

      - name: Verify k3s service is running
        ansible.builtin.assert:
            that:
                - not k3s_service.changed
            fail_msg: "K3s service is not running"
            success_msg: "K3s service is running"

      - name: Test kubectl functionality
        ansible.builtin.command: kubectl version --client
        register: k3s_kubectl_version
        changed_when: false
        environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Verify kubectl is available
        ansible.builtin.assert:
            that:
                - k3s_kubectl_version.rc == 0
            fail_msg: "Kubectl is not available"
            success_msg: "Kubectl is available"

      - name: Get cluster nodes
        ansible.builtin.command: kubectl get nodes
        register: k3s_nodes
        changed_when: false
        environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml

      - name: Verify cluster has nodes
        ansible.builtin.assert:
            that:
                - k3s_nodes.rc == 0
                - "'Ready' in k3s_nodes.stdout or 'NotReady' in k3s_nodes.stdout"
            fail_msg: "No nodes found in cluster"
            success_msg: "Cluster has nodes"

      - name: Check k3s configuration directory
        ansible.builtin.stat:
            path: /etc/rancher/k3s
        register: k3s_config_dir

      - name: Verify k3s configuration exists
        ansible.builtin.assert:
            that:
                - k3s_config_dir.stat.exists
                - k3s_config_dir.stat.isdir
            fail_msg: "K3s configuration directory not found"
            success_msg: "K3s configuration directory exists"

      - name: Check kubeconfig file
        ansible.builtin.stat:
            path: /etc/rancher/k3s/k3s.yaml
        register: k3s_kubeconfig_file

      - name: Verify kubeconfig exists and is readable
        ansible.builtin.assert:
            that:
                - k3s_kubeconfig_file.stat.exists
                - k3s_kubeconfig_file.stat.mode == '0644'
            fail_msg: "Kubeconfig file not found or not readable"
            success_msg: "Kubeconfig file exists and is readable"

      - name: Read rendered k3s config
        ansible.builtin.slurp:
            src: /etc/rancher/k3s/config.yaml
        register: k3s_rendered_config

      - name: Parse rendered k3s config
        ansible.builtin.set_fact:
            k3s_config_parsed: "{{ k3s_rendered_config.content | b64decode | from_yaml }}"

      - name: Verify hardening flags are present by default
        ansible.builtin.assert:
            that:
                - k3s_config_parsed['secrets-encryption'] | default(false) | bool
                - "'anonymous-auth=false' in k3s_config_parsed['kube-apiserver-arg']"
                - "'enable-admission-plugins=NodeRestriction' in k3s_config_parsed['kube-apiserver-arg']"
                - "'audit-log-maxage=30' in k3s_config_parsed['kube-apiserver-arg']"
                - "'read-only-port=0' in k3s_config_parsed['kubelet-arg']"
            fail_msg: "Hardening flags missing from rendered config"
            success_msg: "All hardening flags present in rendered config"

      - name: Verify container log rotation flags are present by default
        ansible.builtin.assert:
            that:
                - "'container-log-max-size=10Mi' in k3s_config_parsed['kubelet-arg']"
                - "'container-log-max-files=5' in k3s_config_parsed['kubelet-arg']"
            fail_msg: "Container log rotation flags missing from rendered config"
            success_msg: "Container log rotation flags present in rendered config"

      - name: Verify protect-kernel-defaults stays off by default
        ansible.builtin.assert:
            that:
                - "'protect-kernel-defaults' not in k3s_config_parsed"
            fail_msg: "protect-kernel-defaults must not be enabled by default"
            success_msg: "protect-kernel-defaults is off as expected"

      - name: Verify user apiserver args coexist with hardening args
        ansible.builtin.assert:
            that:
                - "'request-timeout=2m0s' in k3s_config_parsed['kube-apiserver-arg']"
            fail_msg: "User-supplied apiserver arg was dropped by the hardening merge"
            success_msg: "User apiserver arg survived the hardening merge"

      - name: Check the audit log actually received events
        ansible.builtin.stat:
            path: /etc/rancher/k3s/audit.log
        register: k3s_audit_log

      - name: Verify audit logging is not a no-op
        ansible.builtin.assert:
            that:
                - k3s_audit_log.stat.exists
                - k3s_audit_log.stat.size > 0
            fail_msg: >-
                Audit log is missing or empty — the audit policy is not
                matching any events.
            success_msg: "Audit log contains events"

      - name: Check secrets encryption status
        ansible.builtin.command: k3s secrets-encrypt status
        register: k3s_secrets_encrypt
        changed_when: false

      - name: Verify secrets encryption is active
        ansible.builtin.assert:
            that:
                - "'Enabled' in k3s_secrets_encrypt.stdout"
            fail_msg: "Secrets encryption is not enabled on the running cluster"
            success_msg: "Secrets encryption is enabled"

      - name: Check bash completion files
        ansible.builtin.stat:
            path: "/etc/bash_completion.d/{{ item }}"
        loop:
            - k3s
            - kubectl
        register: k3s_completion_files

      - name: Verify bash completion was actually installed
        ansible.builtin.assert:
            that:
                - item.stat.exists
                - item.stat.size > 0
            fail_msg: >-
                {{ item.item }} bash completion is missing or empty — the
                completion tasks were skipped.
            success_msg: "{{ item.item }} bash completion is installed"
        loop: "{{ k3s_completion_files.results }}"
        loop_control:
            label: "{{ item.item }}"

      - name: Check the K3s environment file
        ansible.builtin.stat:
            path: /etc/systemd/system/k3s.service.env
        register: k3s_env_file

      - name: Verify the environment file was rendered
        ansible.builtin.assert:
            that:
                - k3s_env_file.stat.exists
                - k3s_env_file.stat.size > 0
                - k3s_env_file.stat.mode == '0600'
            fail_msg: >-
                /etc/systemd/system/k3s.service.env is missing, empty or
                world-readable — k3s_environment_vars was never rendered.
            success_msg: "K3s environment file is rendered and 0600"

      # Matched with grep rather than slurp so the file contents never reach the
      # task output.
      - name: Search the environment file for the configured entry
        ansible.builtin.command:
            cmd: grep -qF 'NO_PROXY=localhost,127.0.0.1,10.0.0.0/8' /etc/systemd/system/k3s.service.env
        register: k3s_env_match
        changed_when: false
        failed_when: false

      - name: Verify custom environment variables reach the file
        ansible.builtin.assert:
            that:
                - k3s_env_match.rc == 0
            fail_msg: >-
                The environment file does not contain the value set through
                k3s_environment_vars.
            success_msg: "k3s_environment_vars entries are present"

      # The token used to be rendered here as well, which made the file change
      # between the first and second run and broke idempotence. Assert it stays
      # out, so a reintroduction fails by name instead of only as a diff.
      - name: Search the environment file for a join credential
        ansible.builtin.command:
            cmd: grep -q '^K3S_TOKEN=' /etc/systemd/system/k3s.service.env
        register: k3s_env_token_match
        changed_when: false
        failed_when: false

      - name: Verify the join credential stays out of the environment file
        ansible.builtin.assert:
            that:
                - k3s_env_token_match.rc != 0
            fail_msg: >-
                The environment file carries K3S_TOKEN again. config.yaml is the
                single source for the token; a copy here breaks idempotence.
            success_msg: "Environment file carries no join credential"

      - name: Check K3s server credential directory permissions
        ansible.builtin.stat:
            path: /var/lib/rancher/k3s/server/cred
        register: k3s_cred_dir

      - name: Verify credential directory is not world-readable
        ansible.builtin.assert:
            that:
                - k3s_cred_dir.stat.exists
                - k3s_cred_dir.stat.mode == '0700'
            fail_msg: "K3s credential directory has unexpected permissions"
            success_msg: "K3s credential directory is 0700"

      # Everything above inspects configuration and service state. This
      # schedules a real workload, which is the only check that proves the
      # cluster actually runs pods rather than merely reporting Ready.
      # Driven through kubectl rather than kubernetes.core, like every other
      # check in this file: the modules need the `kubernetes` Python library on
      # the target VM, which the bare cloud image does not ship and no prepare
      # step installs. (requirements.yml pulls the Ansible collection onto the
      # controller, which is a different thing.)
      - name: Deploy a smoke-test pod
        ansible.builtin.command:
            cmd: >-
                kubectl run molecule-smoketest
                --namespace default
                --image=nginx:alpine@sha256:1d40e3eb3bf4f138de1d67193f2aa5309fcaf343eb5ffadbf5e9439de1eb1ebb
                --port=80
        environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        changed_when: true

      - name: Wait for the smoke-test pod to reach Running
        ansible.builtin.command:
            cmd: >-
                kubectl get pod molecule-smoketest --namespace default
                -o jsonpath={.status.phase}
        environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        register: k3s_smoketest_phase
        until: k3s_smoketest_phase.stdout == "Running"
        retries: 30
        delay: 10
        changed_when: false

      - name: Verify the smoke-test pod is running
        ansible.builtin.assert:
            that:
                - k3s_smoketest_phase.stdout == "Running"
            fail_msg: >-
                Smoke-test pod did not reach Running state (last phase:
                {{ k3s_smoketest_phase.stdout | default('none') }})
            success_msg: "Cluster schedules and runs pods"

      - name: Remove the smoke-test pod
        ansible.builtin.command:
            cmd: kubectl delete pod molecule-smoketest --namespace default
        environment:
            KUBECONFIG: /etc/rancher/k3s/k3s.yaml
        changed_when: true

      # converge.yml leaves k3s_apparmor_profile unset, so the role default
      # (false) applies and the disable path runs. prepare.yml plants a
      # leftover profile and disable symlink beforehand, so this exercises the
      # cleanup rather than a host that never had the profile: a leftover is
      # reloaded on every boot and breaks `kubectl exec` and pod termination.
      - name: Check the K3s AppArmor profile file is gone
        ansible.builtin.stat:
            path: /etc/apparmor.d/k3s
        register: k3s_apparmor_profile_stat

      - name: Check the K3s AppArmor disable symlink is gone
        ansible.builtin.stat:
            path: /etc/apparmor.d/disable/k3s
        register: k3s_apparmor_disable_stat

      # securityfs is absent where AppArmor is not enabled (Rocky), which is
      # not the same as "the profile is unloaded" - assert the two apart
      # instead of letting an unreadable path count as a pass.
      - name: Check whether the kernel exposes AppArmor profiles
        ansible.builtin.stat:
            path: /sys/kernel/security/apparmor/profiles
        register: k3s_apparmor_securityfs

      - name: Search the kernel for a loaded K3s AppArmor profile
        ansible.builtin.command:
            cmd: grep -qE '^/usr/local/bin/k3s' /sys/kernel/security/apparmor/profiles
        register: k3s_apparmor_kernel_match
        changed_when: false
        failed_when: false
        when: k3s_apparmor_securityfs.stat.exists

      - name: Verify the disabled K3s AppArmor profile is removed
        ansible.builtin.assert:
            that:
                - not k3s_apparmor_profile_stat.stat.exists
                - not k3s_apparmor_disable_stat.stat.exists
                # rc 1 is "no match", rc 2 is a grep error - only the former
                # proves the profile is not loaded.
                - >-
                    not k3s_apparmor_securityfs.stat.exists
                    or k3s_apparmor_kernel_match.rc == 1
            fail_msg: >-
                k3s_apparmor_profile is off, but the profile is still present
                or the check could not run:
                file={{ k3s_apparmor_profile_stat.stat.exists }},
                disable symlink={{ k3s_apparmor_disable_stat.stat.exists }},
                securityfs={{ k3s_apparmor_securityfs.stat.exists }},
                grep rc={{ k3s_apparmor_kernel_match.rc | default('skipped') }}
            success_msg: "Disabled K3s AppArmor profile is removed and unloaded"
