---
- name: Converge
  hosts: all
  become: true
  vars:
      k3s_role: server
      k3s_cluster_init: true
      k3s_disable:
          - traefik
          - servicelb
      k3s_write_kubeconfig_mode: "0644"
      # Passthrough args must survive alongside the hardening args the role
      # adds itself; verify.yml asserts both are present.
      k3s_kube_apiserver_args:
          - "request-timeout=2m0s"
  pre_tasks:
      # `package` cannot refresh apt metadata, so the Debian family needs
      # an explicit cache update first; a cloud image ships stale lists and
      # the install below would fail with "Unable to locate package".
      - name: Refresh apt cache on the Debian family
        ansible.builtin.apt:
            update_cache: true
        when: ansible_facts['os_family'] == "Debian"

      # The k3s install script needs curl, which the base test images
      # do not ship. Install it before the role runs. Uses `package` so
      # the task also runs on the RedHat family; the previous `apt` task
      # was guarded to Debian and left curl missing everywhere else.
      - name: Ensure curl is present
        ansible.builtin.package:
            name: curl
            state: present

  tasks:
      - name: Include k3s role
        ansible.builtin.include_role:
            name: arillso.container.k3s
